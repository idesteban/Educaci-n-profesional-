}
function calificarItem(item, resp) {
  resp = resp || {};
  if (item.tipo === 'mcq') { const ok = resp.sel !== undefined && resp.sel !== null && Number(resp.sel) === item.r; return { puntaje: ok ? 1 : 0, ok, respondida: resp.sel !== undefined && resp.sel !== null }; }
  const campos = (item.campos || []).map((c) => Object.assign({ id: c.id }, calificarCampo(c, (resp.campos || {})[c.id])));
  const asientos = (item.asientos || []).map((a, i) => calificarAsiento(a.lineas, ((resp.asientos || [])[i]) || []));

  const pts = campos.filter((c) => c.ok).length + suma(asientos, (a) => a.puntaje * pesoA);

/* ---------- Armar diagnóstico y simulacros ---------- */
function preguntasDe(filtro, n, r, excluir) {
  const ex = new Set(excluir || []);
  const pool = PREGUNTAS.filter((q) => filtro(q) && !ex.has(q.id));
  const lista = r.barajar(pool).slice(0, n);
  if (lista.length < n) lista.push(...r.barajar(PREGUNTAS.filter((q) => filtro(q) && ex.has(q.id))).slice(0, n - lista.length));
  return lista;
}
function construirDiagnostico(semilla, excluir) {
  const r = crearAzar(semilla), refs = [];
  for (const etapa of ETAPAS) {
    const conf = DIAGNOSTICO.porEtapa[etapa.id];
    for (const q of preguntasDe((q) => q.e === etapa.id, conf.mcq, r, excluir)) refs.push(refPregunta(q.id, r.ent(1, 2e9)));
    for (const [g, n] of conf.gens) refs.push(refGen(g, n, r.ent(1, 2e9)));
  }

}

  const conf = SIMULACROS[modo], r = crearAzar(semilla), refs = [];
  for (const [g, n] of conf.ejercicios) refs.push(refGen(r.elegir(g.split('|')), n, r.ent(1, 2e9)));

  if (acierto) { d.ok++; d.mal = 0; if (d.ok >= 3 && d.n < 3) { d.n++; d.ok = 0; msg = `Tres aciertos seguidos: subimos a nivel ${d.n} (más transacciones y retenciones).`; } }
  else {
    d.mal++; d.ok = 0;
    if (d.mal >= 2) { d.mal = 0; if (d.n > 1) { d.n--; msg = `Dos fallos seguidos: bajamos a nivel ${d.n}. Pista: antes de escribir el asiento, pregúntate qué cuenta aumenta y cuál es su naturaleza.`; } else msg = 'Dos fallos seguidos. Pista: vuelve al repaso del paso 1 y usa las cuentas sugeridas del ejercicio guiado.'; }
  }
  guardar();
  return msg;
}

/* ---------- Avisos, confirmaciones y teclado ---------- */
function avisar(msg, ms) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), ms || 3800);
}
function confirmar({ titulo, texto, si = 'Sí, continuar', no = 'Cancelar', peligro = false }) {
  return new Promise((res) => {
    const m = $('#modal');
    m.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo"><h3 id="modalTitulo">${esc(titulo)}</h3><p>${texto}</p><div class="acciones"><button type="button" class="btn ${peligro ? 'peligro' : 'primario'}" id="modalSi">${esc(si)}</button><button type="button" class="btn" id="modalNo">${esc(no)}</button></div></div>`;
    m.hidden = false;
    const cerrar = (v) => { m.hidden = true; m.innerHTML = ''; res(v); };
    $('#modalSi').onclick = () => cerrar(true); $('#modalNo').onclick = () => cerrar(false);
    m.onclick = (e) => { if (e.target === m) cerrar(false); };
    $('#modalSi').focus();
  });
}
let controlActivo = null;
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (!$('#modal').hidden) $('#modalNo') && $('#modalNo').click(); if (!$('#calc').hidden) cerrarCalc(); return; }
  if (e.target.matches('input, textarea, select') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[1-4]$/.test(e.key) && controlActivo && controlActivo.teclas) { controlActivo.teclas(Number(e.key)); e.preventDefault(); return; }
  if (e.key === 'Enter') {
    const b = $$('[data-principal]', $('#vista')).find((x) => !x.disabled && x.offsetParent !== null);
    if (b) { b.click(); e.preventDefault(); }
  }
});
let ultimoCampo = null;
document.addEventListener('focusin', (e) => { if (e.target.matches('input.monto')) ultimoCampo = e.target; });
document.addEventListener('focusout', (e) => {
  const x = e.target;
  if (!x.matches || !x.matches('input.monto') || !x.value.trim()) return;
  const v = leerNumero(x.value);
  if (Number.isFinite(v)) { const f = formatoMonto(Math.round(v * 100) / 100); if (f !== x.value) { x.value = f; x.dispatchEvent(new Event('input', { bubbles: true })); } }
});

/* ---------- Piezas reutilizables ---------- */
function metaHTML(item) {
  const chips = [`<span class="chip">${esc(temaNombre(item.tema))}</span>`];
  if (item.etapa) chips.push(`<span class="chip">Etapa ${item.etapa}</span>`);
  if (item.tipo === 'ej' && item.ref) chips.push(`<span class="chip">Nivel ${item.ref.n}</span>`);
  if (item.mts) chips.push('<span class="chip mts">MTS</span>');
  return `<div class="item-meta">${chips.join('')}</div>`;
}
function tablaSolucion(a) {
  const td = suma(a.lineas, (l) => l.d || 0), th = suma(a.lineas, (l) => l.h || 0);
  const filas = a.lineas.map((l) => {
    const alt = (l.eq || []).filter((x) => x.length >= 4);
    return `<tr><td class="mono">${l.c}</td><td class="${l.h ? 'sang' : ''}">${esc(nombreCuenta(l.c))}${l.det ? ` <span class="suave pequeno">(${esc(l.det)})</span>` : ''}${l.t ? ` <span class="suave pequeno">· ${esc(l.t)}</span>` : ''}${alt.length ? ` <span class="suave pequeno">· también: ${alt.join(', ')}</span>` : ''}</td><td class="num d">${l.d ? pesos(l.d) : ''}</td><td class="num">${l.h ? pesos(l.h) : ''}</td></tr>`;
  }).join('');
  return `<div class="desplazar"><table class="tabla-sol"><thead><tr><th>Código</th><th>Cuenta</th><th class="num d">Débito</th><th class="num">Crédito</th></tr></thead><tbody>${filas}</tbody><tfoot><tr><td></td><td>Sumas iguales</td><td class="num d">${pesos(td)}</td><td class="num">${pesos(th)}</td></tr></tfoot></table></div>`;
}
function tablaRepaso(filas) { return tablaSolucion({ lineas: filas.map(([c, d, h]) => ({ c, d, h })) }); }
function campoHTML(c, valor, prefijo) {
  const id = (prefijo || 'c') + '-' + c.id;
  if (c.tipo === 'opcion') {
    return `<div class="campo" data-campo="${c.id}"><label for="${id}">${esc(c.etiqueta)}</label><select id="${id}"><option value="">Elige una opción…</option>${c.ops.map((o, k) => `<option value="${k}" ${String(valor) === String(k) ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select><span class="res"></span></div>`;
  }
  return `<div class="campo" data-campo="${c.id}"><label for="${id}">${esc(c.etiqueta)}</label><input id="${id}" class="monto" inputmode="decimal" autocomplete="off" placeholder="$ 0" value="${esc(valor || '')}"><span class="res"></span></div>`;
}
function marcarCampos(cont, campos, resultados, conPistas, mostrarValor) {
  campos.forEach((c, k) => {
    const caja = $(`[data-campo="${c.id}"]`, cont); if (!caja) return;
    const r = resultados[k];
    caja.classList.remove('ok', 'mal'); caja.classList.add(r.ok ? 'ok' : 'mal');
    let txt = r.ok ? 'Correcto' : r.vacio ? 'Sin responder' : 'Revisa este valor';
    if (!r.ok && conPistas && c.pista) txt += ' · ' + c.pista;
    if (!r.ok && mostrarValor) txt = 'Correcto: ' + (c.tipo === 'opcion' ? c.ops[c.ok] : pesos(c.valor));
    $('.res', caja).textContent = txt;
  });
}
function leerCampos(cont, campos) {
  const out = {};
  for (const c of campos) { const x = $(`[data-campo="${c.id}"] input, [data-campo="${c.id}"] select`, cont); if (x) out[c.id] = x.value; }
  return out;
}

/* Libro diario editable */
function montarDiario(cont, op) {
  const o = Object.assign({ fecha: '', lineas: null, nLineas: 3, deshabilitado: false, onCambio: null }, op || {});
  cont.innerHTML = `<div class="diario"><div class="diario-cab"><span>Fecha</span><span>Código PUC</span><span>Cuenta</span><span class="num">Débito</span><span class="num">Crédito</span><span>Detalle</span><span></span></div>
    <div class="diario-lineas"></div>
    <div class="diario-pie"><button type="button" class="btn texto l-agregar">+ Agregar línea</button><div class="sumas"><span class="pequeno suave">Sumas</span><span class="num tD">$ 0</span><span class="num tH">$ 0</span><span class="cuadre"></span></div></div></div>`;
  const cuerpo = $('.diario-lineas', cont);
  const lineaHTML = (l) => `<input class="l-fecha" value="${esc(l.fecha || o.fecha)}" aria-label="Fecha">
    <div class="l-cod"><input list="pucLista" class="l-codigo" value="${esc(l.cod || '')}" placeholder="Código o nombre de la cuenta" aria-label="Código PUC" autocomplete="off"></div>
    <span class="l-nombre">${esc(l.cod ? nombreCuenta(codigoDe(l.cod)) : '')}</span>
    <input class="l-d monto" inputmode="decimal" value="${esc(l.d || '')}" placeholder="Débito" aria-label="Débito" autocomplete="off">
    <input class="l-h monto" inputmode="decimal" value="${esc(l.h || '')}" placeholder="Crédito" aria-label="Crédito" autocomplete="off">
    <input class="l-det" value="${esc(l.det || '')}" placeholder="Detalle" aria-label="Detalle">
    <button type="button" class="l-quitar" aria-label="Quitar línea">×</button><div class="l-msg" role="status"></div>`;
  function agregar(l) {
    const d = document.createElement('div'); d.className = 'linea'; d.innerHTML = lineaHTML(l || {});
    if (o.deshabilitado) $$('input,button', d).forEach((x) => { x.disabled = true; });
    cuerpo.appendChild(d); return d;
  }
  const iniciales = o.lineas && o.lineas.length ? o.lineas : Array.from({ length: o.nLineas }, () => ({}));
  iniciales.forEach(agregar);
  if (o.deshabilitado) $('.l-agregar', cont).hidden = true;
  function sumas() {
    let d = 0, h = 0;
    for (const li of $$('.linea', cuerpo)) { d += numOr0($('.l-d', li).value); h += numOr0($('.l-h', li).value); }
    $('.tD', cont).textContent = pesos(d); $('.tH', cont).textContent = pesos(h);
    const c = $('.cuadre', cont);
    if (!d && !h) { c.textContent = ''; c.className = 'cuadre'; }
    else if (Math.abs(d - h) <= 1) { c.textContent = 'Cuadra'; c.className = 'cuadre si'; }
    else { c.textContent = 'Diferencia ' + pesos(Math.abs(d - h)); c.className = 'cuadre no'; }
  }
  function limpiarMarca(li) { li.classList.remove('es-ok', 'es-mal', 'es-lado'); $('.l-msg', li).textContent = ''; }
  cuerpo.addEventListener('input', (e) => {
    const li = e.target.closest('.linea'); if (!li) return;
    if (e.target.classList.contains('l-codigo')) {
      const m = /^\s*(\d{2,6})\s*[—-]/.exec(e.target.value);
      if (m) e.target.value = m[1];
      $('.l-nombre', li).textContent = nombreCuenta(codigoDe(e.target.value)) || (codigoDe(e.target.value).length >= 4 ? 'Cuenta no encontrada en el PUC de referencia' : '');
    }
    limpiarMarca(li); sumas(); if (o.onCambio) o.onCambio();
  });
  cuerpo.addEventListener('click', (e) => {
    if (!e.target.classList.contains('l-quitar')) return;
    const lis = $$('.linea', cuerpo);
    if (lis.length <= 1) { $$('input:not(.l-fecha)', lis[0]).forEach((x) => { x.value = ''; }); $('.l-nombre', lis[0]).textContent = ''; }
    else e.target.closest('.linea').remove();
    sumas(); if (o.onCambio) o.onCambio();
  });
  $('.l-agregar', cont).onclick = () => { const li = agregar({}); $('.l-codigo', li).focus(); if (o.onCambio) o.onCambio(); };
  sumas();
  return {
    leer: () => $$('.linea', cuerpo).map((li) => ({ fecha: $('.l-fecha', li).value, cod: codigoDe($('.l-codigo', li).value) || $('.l-codigo', li).value.trim(), d: $('.l-d', li).value, h: $('.l-h', li).value, det: $('.l-det', li).value }))
      .filter((l) => l.cod || l.d || l.h || l.det),
    marcar(res) { $$('.linea', cuerpo).forEach((li, i) => { limpiarMarca(li); const r = res.lineas[i]; if (r && r.estado !== 'vacia') { li.classList.add('es-' + r.estado); $('.l-msg', li).textContent = r.estado === 'ok' ? '' : r.msg; } }); },
    limpiar() { $$('.linea', cuerpo).forEach(limpiarMarca); },
    agregarCodigo(c) {
      let li = $$('.linea', cuerpo).find((x) => !$('.l-codigo', x).value.trim()) || agregar({});
      const inp = $('.l-codigo', li); inp.value = c; inp.dispatchEvent(new Event('input', { bubbles: true }));
      $('.l-d', li).focus();
    },
    deshabilitar() { $$('input,button', cuerpo).forEach((x) => { x.disabled = true; }); $('.l-agregar', cont).hidden = true; }
  };
}
/* Las líneas vacías se filtran al leer; al calificar hay que alinear con las líneas visibles. */
function lineasVisibles(ctrl, cont) {
  return $$('.linea', cont).map((li) => ({ cod: codigoDe($('.l-codigo', li).value) || $('.l-codigo', li).value.trim(), d: $('.l-d', li).value, h: $('.l-h', li).value }));
}

/* ---------- Ítem de selección múltiple ---------- */
function montarMCQ(cont, item, op) {
  cont.innerHTML = `<div class="item mcq">${metaHTML(item)}<p class="item-q">${esc(item.q)}</p>
    <div class="opciones" role="group" aria-label="Opciones de respuesta">${item.orden.map((oi, k) => `<button type="button" class="opcion" data-o="${oi}"><span class="tecla">${k + 1}</span><span>${esc(item.o[oi])}</span></button>`).join('')}</div>
    <div class="retro" hidden></div></div>`;
  let sel = op.resp && op.resp.sel !== undefined && op.resp.sel !== null ? Number(op.resp.sel) : null;
  let cerrada = false;
  const botones = $$('.opcion', cont), retro = $('.retro', cont);
  const pintarSel = () => botones.forEach((b) => b.classList.toggle('elegida', Number(b.dataset.o) === sel));
  function mostrar(res) {
    cerrada = true;
    botones.forEach((b) => { const oi = Number(b.dataset.o); b.disabled = true; b.classList.remove('elegida'); if (oi === item.r) b.classList.add('correcta'); else if (oi === sel) b.classList.add('incorrecta'); });
    retro.hidden = false; retro.className = 'retro ' + (res.ok ? 'ok' : 'mal');
    retro.innerHTML = `<b>${res.ok ? 'Correcto.' : sel === null ? 'Sin responder.' : 'Incorrecto.'}</b><span>${esc(item.x)}</span>${res.ok ? '' : `<span>Respuesta correcta: <b>${esc(item.o[item.r])}</b></span>`}`;
  }
  function elegir(oi) {
    if (cerrada || op.modo === 'revision') return;
    sel = oi;
    if (op.modo === 'examen') { pintarSel(); if (op.onCambio) op.onCambio({ sel }); return; }
    const res = calificarItem(item, { sel });
    mostrar(res);
    if (op.onCalificado) op.onCalificado(res, item);
  }
  botones.forEach((b) => { b.onclick = () => elegir(Number(b.dataset.o)); });
  if (op.modo === 'revision') mostrar(calificarItem(item, { sel })); else pintarSel();
  return { tipo: 'mcq', teclas: (k) => elegir(item.orden[k - 1]), leer: () => ({ sel }) };
}

/* ---------- Ejercicio (campos + asientos) ---------- */
function montarEjercicio(cont, item, op) {
  const resp = op.resp || {};
  const pref = 'e' + Math.random().toString(36).slice(2, 7);
  const sug = op.guiado && item.sugeridas && item.sugeridas.length ? [...new Set(item.sugeridas)] : [];
  cont.innerHTML = `<div class="item ej">${metaHTML(item)}<h3>${esc(item.titulo)}</h3>
    <div class="enunciado">${item.enunciado}</div>
    ${item.campos.length ? `<div class="campos">${item.campos.map((c) => campoHTML(c, (resp.campos || {})[c.id], pref)).join('')}</div>` : ''}
    ${sug.length && item.asientos.length ? `<div class="sugeridas"><span class="pequeno suave">Cuentas sugeridas (tócalas para agregarlas; no todas se usan):</span>${sug.map((c) => `<button type="button" class="chip chip-btn" data-sug="${c}">${c} ${esc(nombreCuenta(c))}</button>`).join('')}</div>` : ''}
    <div class="pila asientos-cont"></div>
    <div class="retro" hidden></div>
    <div class="acciones"></div>
    <div class="solucion" hidden></div></div>`;
  const acciones = $('.acciones', cont), retro = $('.retro', cont), sol = $('.solucion', cont);
  const cajas = [];
  const diarios = item.asientos.map((a, i) => {
    const caja = document.createElement('div'); caja.className = 'asiento';
    caja.innerHTML = `<div class="asiento-cab"><h4>${esc(a.titulo)}</h4><span class="mono pequeno suave">${esc(a.fecha)}</span></div><div></div>`;
    $('.asientos-cont', cont).appendChild(caja); cajas.push(caja);
    return montarDiario(caja.lastElementChild, { fecha: a.fecha, lineas: (resp.asientos || [])[i], nLineas: Math.min(Math.max(a.lineas.length, 2), 4), deshabilitado: op.modo === 'revision', onCambio: cambio });
  });
  let ultimoDiario = 0;
  cajas.forEach((c, i) => c.addEventListener('focusin', () => { ultimoDiario = i; }));
  $$('[data-sug]', cont).forEach((b) => { b.onclick = () => diarios[ultimoDiario] && diarios[ultimoDiario].agregarCodigo(b.dataset.sug); });
  const leer = () => ({ campos: leerCampos(cont, item.campos), asientos: diarios.map((d, i) => lineasVisibles(d, cajas[i]).filter((l) => l.cod || l.d || l.h)) });
  function cambio() { if (op.onCambio) op.onCambio(leer()); }
  $$('.campos input, .campos select', cont).forEach((x) => x.addEventListener(x.tagName === 'SELECT' ? 'change' : 'input', () => { const c = x.closest('.campo'); c.classList.remove('ok', 'mal'); $('.res', c).textContent = ''; cambio(); }));
  let vioSolucion = false, intentos = 0, pistaN = 0;
  function calificarAhora() {
    const r0 = { campos: leerCampos(cont, item.campos), asientos: diarios.map((d, i) => lineasVisibles(d, cajas[i])) };
    const res = calificarItem(item, r0);
    marcarCampos(cont, item.campos, res.campos, op.guiado, false);
    res.asientos.forEach((ra, i) => diarios[i].marcar(ra));
    const faltan = [];
    res.asientos.forEach((ra, i) => ra.faltantes.forEach((f) => faltan.push({ i, f })));
    retro.hidden = false;
    retro.className = 'retro ' + (res.puntaje >= CONFIG.umbralAprobado ? 'ok' : res.puntaje >= 0.5 ? 'medio' : 'mal');
    let t = `<b>Resultado: ${porcentaje(res.puntaje)}</b>`;
    if (res.asientos.some((a) => !a.cuadra)) t += '<span>Hay un asiento descuadrado: los débitos deben ser iguales a los créditos.</span>';
    if (faltan.length) {
      if (op.guiado) t += '<span>Te falta registrar:</span><ul>' + faltan.map(({ i, f }) => `<li>${item.asientos.length > 1 ? `<b>${esc(item.asientos[i].titulo)}:</b> ` : ''}una cuenta al <b>${f.lado === 'D' ? 'débito' : f.lado === 'H' ? 'crédito' : 'débito o crédito'}</b>${f.pista ? ' – ' + esc(f.pista) : ''}</li>`).join('') + '</ul>';
      else t += `<span>Te faltan ${faltan.length} ${faltan.length === 1 ? 'línea' : 'líneas'} en ${res.asientos.length > 1 ? 'los asientos' : 'el asiento'}.</span>`;
    }
    t += '<span class="pequeno">Verde: correcto · Rojo: cuenta o valor incorrecto · Amarillo: cuenta correcta en el lado equivocado.</span>';
    retro.innerHTML = t;
    intentos++;
    return res;
  }
  function mostrarSolucion() {
    vioSolucion = true;
    sol.hidden = false;
    sol.innerHTML = `<h4>Solución paso a paso</h4>${item.solucion || ''}${item.asientos.map((a) => `<div class="pila"><b>${esc(a.titulo)}</b> <span class="mono pequeno suave">${esc(a.fecha)}</span>${tablaSolucion(a)}</div>`).join('')}`;
    if (item.campos.length && op.modo !== 'examen') {
      const r0 = calificarItem(item, { campos: leerCampos(cont, item.campos) });
      marcarCampos(cont, item.campos, r0.campos, false, true);
    }
    if (op.onSolucion) op.onSolucion();
  }
  function pista() {
    const lista = [];
    for (const c of item.campos) if (c.pista) lista.push(`${c.etiqueta}: ${c.pista}`);
    for (const a of item.asientos) for (const l of a.lineas) if (l.pista) lista.push(`${l.c} ${nombreCuenta(l.c)} – ${l.pista}`);
    if (!lista.length) { avisar('Este ejercicio no tiene más pistas: revisa el repaso.'); return; }
    avisar('Pista: ' + lista[pistaN % lista.length], 7000); pistaN++;
  }
  if (op.modo === 'practica') {
    acciones.innerHTML = `<button type="button" class="btn primario" data-accion="calificar" data-principal>Calificar</button>${op.guiado ? '<button type="button" class="btn" data-accion="pista">Pista</button>' : ''}<button type="button" class="btn texto" data-accion="solucion">Ver solución</button>`;
    acciones.addEventListener('click', (e) => {
      const b = e.target.closest('[data-accion]'); if (!b) return;
      if (b.dataset.accion === 'calificar') {
        if (!op.guiado && intentos >= 1 && op.unIntento) return;
        const res = calificarAhora();
        if (op.onCalificado) op.onCalificado(res, item, { intentos, vioSolucion });
        if (op.unIntento) { b.disabled = true; $$('input,select', cont).forEach((x) => { x.disabled = true; }); }
      } else if (b.dataset.accion === 'pista') pista();
      else if (b.dataset.accion === 'solucion') mostrarSolucion();
    });
  } else if (op.modo === 'revision') {
    const res = calificarItem(item, resp);
    marcarCampos(cont, item.campos, res.campos, false, true);
    $$('.campos input, .campos select', cont).forEach((x) => { x.disabled = true; });
    res.asientos.forEach((ra, i) => diarios[i].marcar(ra));
    retro.hidden = false; retro.className = 'retro ' + (res.puntaje >= CONFIG.umbralAprobado ? 'ok' : res.puntaje >= 0.5 ? 'medio' : 'mal');
    retro.innerHTML = `<b>Obtuviste ${porcentaje(res.puntaje)} en este ejercicio.</b>`;
    mostrarSolucion();
  }
  return { tipo: 'ej', leer, calificar: calificarAhora, mostrarSolucion, get vioSolucion() { return vioSolucion; } };
}
function montarItem(cont, item, op) { return item.tipo === 'mcq' ? montarMCQ(cont, item, op) : montarEjercicio(cont, item, op); }

/* ---------- Navegación ---------- */

  $('#navLateral').innerHTML = grupos.map((g) => `<div class="grupo etiqueta">${esc(g)}</div>` + MODULOS.filter((m) => m.grupo === g).map((m) => `<a href="#${m.id}" class="${m.id === activo ? 'activo' : ''}">${icono(m.icono)}<span>${esc(m.nombre)}</span></a>`).join('')).join('');
  $('#navInferior').innerHTML = MODULOS.filter((m) => m.inferior).map((m) => `<a href="#${m.id}" class="${m.id === activo ? 'activo' : ''}">${icono(m.icono)}<span>${esc(m.corto || m.nombre)}</span></a>`).join('') +

function puntajeDiagEtapa(id) { const d = E.diag[E.diag.length - 1]; return d && d.porEtapa[id] !== undefined ? d.porEtapa[id] : null; }
function estadoEtapa(id) {
  const st = E.etapas[id] || {};
  if (st.completada) return { color: 'verde', texto: 'Dominada en la ruta' };
  const p = puntajeDiagEtapa(id);
  if (p === null) return { color: 'gris', texto: 'Sin diagnóstico' };
  const c = colorNivel(p);
  return { color: c, texto: `Diagnóstico ${porcentaje(p)} · ${c === 'verde' ? 'dominado' : c === 'amarillo' ? 'reforzar' : 'repasar desde cero'}` };
}
function ordenRuta() {
  return ETAPAS.slice().sort((a, b) => {
    const ca = (E.etapas[a.id] || {}).completada ? 1 : 0, cb = (E.etapas[b.id] || {}).completada ? 1 : 0;
    if (ca !== cb) return ca - cb;
    const pa = puntajeDiagEtapa(a.id), pb = puntajeDiagEtapa(b.id);
    if (pa !== null && pb !== null && Math.abs(pa - pb) > 1e-6) return pa - pb;

    return a.id - b.id;

}
function siguienteEtapa() { if (!E.diag.length) return null; return ordenRuta().find((e) => !(E.etapas[e.id] || {}).completada) || null; }

function graficaAntesDespues(a, b) {
  const W = 640, H = 230, izq = 34, abajo = 30, arriba = 12, ancho = (W - izq - 8) / 10;
  const y = (p) => arriba + (H - arriba - abajo) * (1 - p);
  let s = `<svg class="grafica" viewBox="0 0 ${W} ${H}" role="img" aria-label="Puntaje por etapa: primer diagnóstico frente al último">`;
  for (const t of [0, 0.5, 0.8, 1]) s += `<line x1="${izq}" x2="${W - 8}" y1="${y(t)}" y2="${y(t)}" stroke="var(--regla)" stroke-dasharray="${t === 0.8 ? '4 3' : ''}"/><text x="${izq - 6}" y="${y(t) + 4}" text-anchor="end">${t * 100}</text>`;
  ETAPAS.forEach((e, k) => {
    const x0 = izq + k * ancho + ancho * 0.15, bw = ancho * 0.33;
    const pa = a.porEtapa[e.id] || 0, pb = b.porEtapa[e.id] || 0;
    s += `<rect x="${x0}" y="${y(pa)}" width="${bw}" height="${Math.max(1, y(0) - y(pa))}" rx="2" fill="var(--tinta-3)"><title>E${e.id} antes: ${porcentaje(pa)}</title></rect>`;
    s += `<rect x="${x0 + bw + 2}" y="${y(pb)}" width="${bw}" height="${Math.max(1, y(0) - y(pb))}" rx="2" fill="var(--acento)"><title>E${e.id} ahora: ${porcentaje(pb)}</title></rect>`;
    s += `<text x="${x0 + bw}" y="${H - 10}" text-anchor="middle">E${e.id}</text>`;
  });
  return s + '</svg><div class="leyenda"><span><i style="background:var(--tinta-3)"></i>Primer diagnóstico (' + porcentaje(a.total) + ')</span><span><i style="background:var(--acento)"></i>Último diagnóstico (' + porcentaje(b.total) + ')</span><span>Línea punteada: 80 %</span></div>';
}

        <a class="btn ${k === 0 && !st.completada ? 'primario' : ''}" href="#etapa-${e.id}">${st.completada ? 'Repasar' : paso ? 'Continuar' : 'Empezar'}</a></div></div>`;
    }).join('')}</div>
    ${ETAPAS.every((e) => (E.etapas[e.id] || {}).completada) ? '<div class="aviso ok"><span><b>¡Completaste toda la ruta!</b> Haz la <a href="#diagnostico-nuevo">reevaluación</a> para ver tu gráfica de antes y después.</span></div>' : ''}</div>`;
}

/* ---------- Etapa con sus 4 pasos ---------- */
function vistaEtapa(v, p) {
  const etapa = ETAPAS.find((e) => e.id === Number(p));
  if (!etapa) { ir('ruta'); return; }
  const st = E.etapas[etapa.id] = E.etapas[etapa.id] || { paso: 0, ej: 0, completada: false };
  let pasoVisto = Math.min(st.paso, 3);
  function pintar() {
    const s = estadoEtapa(etapa.id);
    v.innerHTML = `<div class="vista"><div class="encabezado"><a class="btn texto" href="#ruta" style="align-self:flex-start;padding-left:0">← Mi ruta</a><span class="etiqueta">Etapa ${etapa.id} del ciclo contable</span><h1>${esc(etapa.nombre)}</h1>
      <div class="fila"><span class="chip ${s.color}">${esc(s.texto)}</span>${etapa.mts ? '<span class="chip mts">Prioridad MTS</span>' : ''}<span class="chip">Dificultad: nivel ${nivelEtapa(etapa.id)} de 3</span></div></div>
      <div class="pasos-ruta" role="tablist">${NOMBRE_PASOS.map((n, k) => `<button type="button" role="tab" data-paso="${k}" class="${k < st.paso || st.completada ? 'hecho' : ''} ${k === pasoVisto ? 'actual' : ''}" ${k > st.paso && !st.completada ? 'disabled' : ''} aria-selected="${k === pasoVisto}"><span>Paso ${k + 1}</span><b>${n}</b></button>`).join('')}</div>
      <div id="pasoCont" class="pila"></div></div>`;
    $$('[data-paso]', v).forEach((b) => { b.onclick = () => { pasoVisto = Number(b.dataset.paso); pintar(); }; });
    const c = $('#pasoCont');
    [pasoRepaso, pasoGuiado, pasoIndependiente, pasoMini][pasoVisto](c);
  }
  function avanzarA(k) { st.paso = Math.max(st.paso, k); st.actual = null; pasoVisto = k; guardar(); pintar(); window.scrollTo(0, 0); }
  function pasoRepaso(c) {
    if (!etapa.repaso.length) {
      c.innerHTML = `<div class="tarjeta pila"><h3>Repaso express</h3><p>El repaso con ejemplo resuelto de esta etapa se está preparando. Ya puedes practicar con el ejercicio guiado: tiene pistas y cuentas sugeridas.</p><div class="acciones"><button type="button" class="btn primario" id="btnSeguir" data-principal>Ir al ejercicio guiado</button></div></div>`;
      $('#btnSeguir').onclick = () => avanzarA(1); return;
    }
    const rp = etapa.repaso[st.ej % etapa.repaso.length];
    c.innerHTML = `<div class="tarjeta pila"><div class="fila entre"><span class="etiqueta">Repaso express · lectura de 2 minutos · ejemplo ${(st.ej % etapa.repaso.length) + 1} de ${etapa.repaso.length}</span></div>
      <h3>${esc(rp.titulo)}</h3><div class="enunciado">${rp.concepto}</div>
      <div class="solucion"><h4>Ejemplo resuelto</h4><p>${esc(rp.enunciado)}</p>${pasos(rp.pasos)}${tablaRepaso(rp.asiento)}${rp.nota ? `<p class="pequeno suave">${esc(rp.nota)}</p>` : ''}</div>
      <div class="acciones"><button type="button" class="btn primario" id="btnSeguir" data-principal>Entendido: ir al ejercicio guiado</button>${etapa.repaso.length > 1 ? '<button type="button" class="btn" id="btnOtroEj">Ver otro ejemplo</button>' : ''}</div></div>`;
    $('#btnSeguir').onclick = () => avanzarA(1);
    const o = $('#btnOtroEj'); if (o) o.onclick = () => { st.ej++; guardar(); pintar(); };
  }
  function ejercicioDePaso(lista, guiado) {
    if (!st.actual || st.actual.paso !== pasoVisto) {
      const g = guiado ? lista[st.ej % lista.length] : lista[Math.floor(Math.random() * lista.length)];
      st.actual = { paso: pasoVisto, ref: refGen(g, guiado ? Math.min(nivelEtapa(etapa.id), 2) : nivelEtapa(etapa.id)), resp: null, calificado: false };
      guardar();
    }
    return st.actual;
  }
  function pasoEjercicio(c, guiado) {
    const lista = guiado ? etapa.guiado : etapa.independiente;
    const a = ejercicioDePaso(lista, guiado);
    const item = crearItem(a.ref);
    c.innerHTML = `<div class="aviso info"><span>${guiado ? '<b>Ejercicio guiado:</b> si te equivocas verás pistas en cada valor y en las cuentas que faltan. Puedes corregir y volver a calificar. Necesitas 80 % sin mirar la solución.' : '<b>Ejercicio independiente:</b> valores nuevos y un solo intento, sin pistas. Necesitas 80 %.'}</span></div><div class="tarjeta" id="ejCont"></div><div class="acciones" id="ejAcc"></div>`;
    const acc = $('#ejAcc');
    const otro = () => { st.actual = null; if (guiado) st.ej++; guardar(); pintar(); window.scrollTo(0, 0); };
    const ctrl = montarItem($('#ejCont'), item, {
      modo: 'practica', guiado, unIntento: !guiado, resp: a.resp,
      onCambio: (r) => { a.resp = r; guardar(); },
      onCalificado: (res, it, info) => {
        const primera = !a.calificado; a.calificado = true;
        if (primera) { registrarResultado(it, res.puntaje); const m = ajustarDificultad(etapa.id, res.puntaje >= CONFIG.umbralAprobado); if (m) avisar(m, 6500); }
        const aprobado = res.puntaje >= CONFIG.umbralAprobado && !(info && info.vioSolucion);
        acc.innerHTML = aprobado
          ? `<div class="aviso ok"><span><b>¡Bien! ${porcentaje(res.puntaje)}.</b> ${guiado ? 'Pasa al ejercicio independiente.' : 'Pasa a la mini evaluación.'}</span></div><button type="button" class="btn primario" id="btnAvanzar" data-principal>${guiado ? 'Siguiente paso: ejercicio independiente' : 'Siguiente paso: mini evaluación'}</button>`
          : `<div class="aviso"><span>${info && info.vioSolucion ? 'Viste la solución: intenta con otro ejercicio para avanzar.' : guiado ? `Llevas ${porcentaje(res.puntaje)}. Corrige lo marcado en rojo o amarillo (usa “Pista”) y vuelve a calificar, o prueba otro ejercicio.` : `Obtuviste ${porcentaje(res.puntaje)}. Revisa la solución y practica con otro ejercicio con valores nuevos.`}</span></div><button type="button" class="btn" id="btnOtro">Otro ejercicio</button>`;
        const av = $('#btnAvanzar'); if (av) av.onclick = () => avanzarA(guiado ? 2 : 3);
        const ot = $('#btnOtro'); if (ot) ot.onclick = otro;
      },
      onSolucion: () => { a.vioSolucion = true; if (!$('#btnOtro')) { acc.insertAdjacentHTML('beforeend', '<button type="button" class="btn" id="btnOtro2">Otro ejercicio</button>'); $('#btnOtro2').onclick = otro; } }
    });
    controlActivo = ctrl;
    if (!a.calificado) acc.innerHTML = '<button type="button" class="btn texto" id="btnCambiar">Cambiar por otro ejercicio</button>';
    const cb = $('#btnCambiar'); if (cb) cb.onclick = otro;
  }
  function pasoGuiado(c) { pasoEjercicio(c, true); }
  function pasoIndependiente(c) { pasoEjercicio(c, false); }
  function pasoMini(c) {
    if (!st.mini) {
      const r = crearAzar(semillaNueva()), refs = [];
      const nMcq = Math.min(etapa.mini.mcq, PREGUNTAS.filter((q) => q.e === etapa.id).length);
      for (const q of preguntasDe((q) => q.e === etapa.id, nMcq, r)) refs.push(refPregunta(q.id));
      while (refs.length < 5) refs.push(refGen(r.elegir(etapa.mini.gens), nivelEtapa(etapa.id)));
      st.mini = { refs: r.barajar(refs), i: 0, res: [] }; guardar();
    }
    const m = st.mini;
    if (m.i >= m.refs.length) {
      const prom = suma(m.res) / m.res.length, ok = prom >= CONFIG.umbralAprobado;
      if (ok) { st.completada = true; st.mejor = Math.max(st.mejor || 0, prom); }
      const sig = ordenRuta().find((e) => e.id !== etapa.id && !(E.etapas[e.id] || {}).completada);
      c.innerHTML = `<div class="tarjeta pila"><h3>Mini evaluación: ${porcentaje(prom)}</h3>${ok ? `<div class="aviso ok"><span><b>¡Etapa dominada!</b> Queda en verde en tu mapa.</span></div>` : `<div class="aviso mal"><span>Necesitas 80 %. Volvemos al repaso con otro ejemplo resuelto y luego repites los pasos.</span></div>`}
        <div class="acciones">${ok ? (sig ? `<a class="btn primario" href="#etapa-${sig.id}" data-principal>Siguiente etapa: ${esc(sig.corto)}</a>` : '<a class="btn primario" href="#diagnostico-nuevo" data-principal>Hacer la reevaluación</a>') + '<a class="btn" href="#ruta">Ver mi ruta</a>' : '<button type="button" class="btn primario" id="btnRepaso" data-principal>Volver al repaso</button>'}</div></div>`;
      const b = $('#btnRepaso');
      if (b) b.onclick = () => { st.mini = null; st.paso = 0; st.ej++; st.actual = null; pasoVisto = 0; guardar(); pintar(); window.scrollTo(0, 0); };
      if (ok) { st.mini = null; } guardar();
      return;
    }
    const item = crearItem(m.refs[m.i]);
    c.innerHTML = `<div class="fila entre"><b>Mini evaluación · ítem ${m.i + 1} de ${m.refs.length}</b><span class="pequeno suave">Un intento por ítem</span></div><div class="progreso"><i style="width:${Math.round(m.i / m.refs.length * 100)}%"></i></div><div class="tarjeta" id="miniItem"></div><div class="acciones" id="miniAcc"></div>`;
    controlActivo = montarItem($('#miniItem'), item, {
      modo: 'practica', guiado: false, unIntento: true,
      onCalificado: (res, it) => {
        if (m.res.length > m.i) return;
        m.res.push(res.puntaje); registrarResultado(it, res.puntaje);
        const msg = ajustarDificultad(etapa.id, res.puntaje >= CONFIG.umbralAprobado); if (msg) avisar(msg, 6500);
        guardar();
        $('#miniAcc').innerHTML = `<button type="button" class="btn primario" id="miniSig" data-principal>${m.i + 1 < m.refs.length ? 'Siguiente ítem' : 'Ver resultado'}</button>`;
        $('#miniSig').onclick = () => { m.i++; guardar(); pintar(); window.scrollTo(0, 0); };
      },
      onSolucion: () => { if (m.res.length <= m.i) { m.res.push(0); registrarResultado(item, 0); guardar(); $('#miniAcc').innerHTML = '<button type="button" class="btn primario" id="miniSig" data-principal>Siguiente ítem</button>'; $('#miniSig').onclick = () => { m.i++; guardar(); pintar(); window.scrollTo(0, 0); }; } }
    });
  }
  pintar();
}

/* ---------- Sesión de práctica genérica (errores, temas) ---------- */
function vistaSesion(v) {
  const s = E.sesion;
  if (!s || !s.refs.length) { v.innerHTML = '<div class="vista"><div class="tarjeta pila"><h3>No hay una sesión activa</h3><p>Empieza desde el tablero o desde los resultados de un simulacro.</p><a class="btn primario" href="#inicio">Ir al inicio</a></div></div>'; return; }
  if (s.i >= s.refs.length) {
    const prom = s.res.length ? suma(s.res) / s.res.length : 0;
    v.innerHTML = `<div class="vista"><div class="encabezado"><span class="etiqueta">Sesión terminada</span><h1>${esc(s.titulo)}</h1></div><div class="tarjeta pila"><div class="dato-grande">${porcentaje(prom)}</div><p>${s.res.filter((x) => x >= CONFIG.umbralAprobado).length} de ${s.res.length} ítems con 80 % o más. ${E.errores.length ? `Te quedan ${E.errores.length} errores por repasar.` : 'No te quedan errores pendientes.'}</p>
      <div class="acciones"><a class="btn primario" href="${esc(s.volver)}" data-principal>Volver</a>${E.errores.length ? '<button type="button" class="btn" id="otraRonda">Otra ronda de errores</button>' : ''}</div></div></div>`;
    const b = $('#otraRonda'); if (b) b.onclick = () => practicarErrores(s.volver);
    return;
  }
  const item = crearItem(s.refs[s.i]);
  v.innerHTML = `<div class="vista"><div class="fila entre"><div><span class="etiqueta">${esc(s.titulo)}</span><h2>Ítem ${s.i + 1} de ${s.refs.length}</h2></div><a class="btn texto" href="${esc(s.volver)}">Salir</a></div>
    <div class="progreso"><i style="width:${Math.round(s.i / s.refs.length * 100)}%"></i></div><div class="tarjeta" id="sesItem"></div><div class="acciones" id="sesAcc"></div></div>`;
  const siguiente = () => { s.i++; guardar(); render(); window.scrollTo(0, 0); };
  const listo = (p) => { if (s.res.length > s.i) return; s.res.push(p); guardar(); $('#sesAcc').innerHTML = '<button type="button" class="btn primario" id="sesSig" data-principal>Siguiente</button>'; $('#sesSig').onclick = siguiente; };
  controlActivo = montarItem($('#sesItem'), item, { modo: 'practica', guiado: true, onCalificado: (res, it) => { if (s.res.length <= s.i) registrarResultado(it, res.puntaje); listo(res.puntaje); }, onSolucion: () => { if (s.res.length <= s.i) registrarResultado(item, 0); listo(0); } });
}

/* ---------- Caso integrado “Mes completo” ---------- */
const MES_CACHE = {};
function mesDe(id) { if (!MES_CACHE[id]) MES_CACHE[id] = construirMes(versionMes(id)); return MES_CACHE[id]; }
function estadoMes(id) { const st = E.mes[id] = E.mes[id] || {}; st.resp = st.resp || {}; st.puntajes = st.puntajes || {}; st.detalle = st.detalle || {}; st.etapa = st.etapa || 'diario'; return st; }
function claseP(p) { return p >= CONFIG.umbralAprobado ? 'ok' : p >= 0.5 ? 'medio' : 'mal'; }
function selectorMes(v) {
  const aleatorios = Object.keys(E.mes).filter((k) => k.startsWith('R'));
  const tarjeta = (id, nombre) => {
    const ver = versionMes(id), st = E.mes[id], n = st && st.puntajes ? Object.keys(st.puntajes).length : 0;
    const prom = n ? suma(Object.values(st.puntajes)) / n : null;
    return `<div class="tarjeta pila"><span class="etiqueta">${esc(nombre)}</span><h3>${esc(ver.empresa)}</h3><p class="suave">${esc(mesTxt(ver.mes, ver.anio))} · administración de propiedades y parqueaderos en Bogotá</p>
      <div class="progreso"><i style="width:${Math.round(n / ETAPAS_MES.length * 100)}%"></i></div><span class="pequeno suave">${n} de ${ETAPAS_MES.length} etapas calificadas${prom !== null ? ' · promedio ' + porcentaje(prom) : ''}</span>
      <a class="btn ${id === 'A' ? 'primario' : ''}" href="#mes-${id}">${n ? 'Continuar' : 'Empezar'}</a></div>`;
  };
  v.innerHTML = `<div class="vista"><div class="encabezado"><span class="etiqueta">Ejercicio estrella</span><h1>Caso integrado: Mes completo</h1>
    <p>Una empresa que administra propiedades y parqueaderos en Bogotá, con saldos iniciales y 22 transacciones del mes: facturación fija y variable, recaudos en efectivo, datáfono y transferencia, compras y servicios con retenciones, documento soporte, nómina, pagos por flujo de caja y un extracto con partidas pendientes. Recorres todo el ciclo y cada etapa se califica por separado.</p></div>
    <div class="fila">${ETAPAS_MES.map((e, k) => `<span class="chip">${k + 1}. ${esc(e.nombre)}</span>`).join('')}</div>
    <div class="rejilla">${MES_VERSIONES.map((x) => tarjeta(x.id, x.nombre)).join('')}
      <div class="tarjeta pila"><span class="etiqueta">Modo aleatorio</span><h3>Valores nuevos cada vez</h3><p class="suave">Otra empresa, otro mes y otras cifras, con la misma estructura del caso.</p><button type="button" class="btn" id="btnAleatorio">Generar un caso nuevo</button>
        ${aleatorios.length ? `<span class="pequeno suave">Casos aleatorios guardados:</span><div class="fila">${aleatorios.slice(-4).map((k) => `<a class="btn texto" href="#mes-${k}">${esc(versionMes(k).empresa)} (${esc(MESES[versionMes(k).mes - 1])})</a>`).join('')}</div>` : ''}</div></div></div>`;
  $('#btnAleatorio').onclick = () => ir('mes-R' + semillaNueva());
}
function vistaMes(v, p) {
  if (!p) return selectorMes(v);
  const m = mesDe(p), st = estadoMes(p);
  const tabla = (filas) => `<div class="desplazar"><table class="tabla"><thead><tr><th>Código</th><th>Cuenta</th><th class="num">Débito</th><th class="num">Crédito</th></tr></thead><tbody>${filas.map((f) => `<tr><td class="mono">${f.c}</td><td>${esc(nombreCuenta(f.c))}</td><td class="num mono">${f.s > 0 ? pesos(f.s) : ''}</td><td class="num mono">${f.s < 0 ? pesos(-f.s) : ''}</td></tr>`).join('')}</tbody><tfoot><tr><td></td><td>Sumas iguales</td><td class="num mono">${pesos(suma(filas.filter((f) => f.s > 0), (f) => f.s))}</td><td class="num mono">${pesos(-suma(filas.filter((f) => f.s < 0), (f) => f.s))}</td></tr></tfoot></table></div>`;

      <div class="etapas-mes" role="tablist">${ETAPAS_MES.map((e, k) => `<button type="button" role="tab" data-et="${e.id}" class="${st.etapa === e.id ? 'actual' : ''}" aria-selected="${st.etapa === e.id}"><span>${k + 1}</span><b>${esc(e.corto)}</b><span class="pt">${st.puntajes[e.id] !== undefined ? porcentaje(st.puntajes[e.id]) : '—'}</span></button>`).join('')}<button type="button" data-et="resumen" class="${st.etapa === 'resumen' ? 'actual' : ''}"><span>✓</span><b>Resumen</b><span class="pt">${Object.keys(st.puntajes).length ? porcentaje(suma(Object.values(st.puntajes)) / ETAPAS_MES.length) : '—'}</span></button></div>

    ({ diario: () => etapaAsientos(c, 'diario'), ajustes: () => etapaAsientos(c, 'ajustes'), t: () => etapaT(c), bp: () => etapaBalance(c, 'bp'), bpa: () => etapaBalance(c, 'bpa'),
      conc: () => etapaConc(c), eeff: () => etapaCampos(c, 'eeff'), cxpc: () => etapaCampos(c, 'cxpc'), resumen: () => etapaResumen(c) })[st.etapa]();
  }
  function guardarPuntaje(clave, p) { st.puntajes[clave] = p; guardar(); const b = $(`[data-et="${clave}"] .pt`, v); if (b) b.textContent = porcentaje(p); marcarPractica(); }
  function botonesEtapa(c, onCal, onSol) {
    c.insertAdjacentHTML('beforeend', '<div class="acciones"><button type="button" class="btn primario" data-cal-etapa data-principal>Calificar la etapa</button><button type="button" class="btn texto" data-sol-etapa>Ver solución</button></div><div class="pila" data-res-etapa></div>');
    $('[data-cal-etapa]', c).onclick = onCal; $('[data-sol-etapa]', c).onclick = onSol;
    return $('[data-res-etapa]', c);

    c.insertAdjacentHTML('beforeend', `<div class="aviso info"><span>${clave === 'diario' ? 'Registra el asiento de cada transacción (ábrela tocándola). Puedes calificar una por una o toda la etapa al final. Usa el buscador del PUC en la casilla de código.' : 'Registra los ajustes del cierre. Los datos de activos, seguro y nómina están en los saldos iniciales y en las transacciones.'}</span></div><div class="pila" data-lista></div>`);
    const cont = $('[data-lista]', c), ctrls = {};
    for (const t of lista) {
      const d = document.createElement('details');
      d.className = 'tx ' + (det[t.n] !== undefined ? claseP(det[t.n]) : '');
      d.innerHTML = `<summary><span class="n">${pre}${t.n}</span><span class="d">${esc(t.fecha)} · ${esc(t.corto)}${t.doc ? ` <span class="suave pequeno">· ${esc(t.doc)}</span>` : ''}</span><span class="mono pequeno" data-pt>${det[t.n] !== undefined ? porcentaje(det[t.n]) : ''}</span></summary>

function vistaSimulacro(v, p) {
  if (p === 'curso' && E.simActivo) return simEnCurso(v);
  if (/^r\d+$/.test(p) && E.simulacros[Number(p.slice(1))]) return simResultado(v, E.simulacros[Number(p.slice(1))]);
  if ((p === 'mts' || p === 'rapido') && !E.simActivo) return simInicio(v, p);
  const act = E.simActivo;
  v.innerHTML = `<div class="vista"><div class="encabezado"><span class="etiqueta">Condiciones de prueba</span><h1>Simulacros cronometrados</h1><p>Sin retroalimentación durante la prueba. Al final verás el puntaje total y por tema, el tiempo usado y la revisión de cada ítem con su explicación.</p></div>
    ${act ? `<div class="aviso"><span><b>Tienes un ${esc(SIMULACROS[act.modo].nombre.toLowerCase())} en curso.</b> Quedan ${Math.max(0, Math.round((act.fin - Date.now()) / 60000))} minutos.</span></div><div class="acciones"><a class="btn primario" href="#simulacro-curso" data-principal>Continuar</a><button type="button" class="btn peligro" id="btnAbandonar">Abandonar</button></div>` : ''}
    <div class="rejilla dos">${Object.entries(SIMULACROS).map(([k, s]) => `<div class="tarjeta pila"><span class="etiqueta">${s.minutos} minutos</span><h3>${esc(s.nombre)}</h3><p class="suave">${esc(s.descripcion)}</p><a class="btn ${k === 'mts' ? 'primario' : ''}" href="#simulacro-${k}">${k === 'mts' ? 'Preparar simulacro MTS' : 'Preparar simulacro rápido'}</a></div>`).join('')}</div>
    <div class="tarjeta pila"><h3>Historial</h3>${E.simulacros.length ? `<div class="desplazar"><table class="tabla"><thead><tr><th>Fecha</th><th>Modo</th><th class="num">Puntaje</th><th class="num">Tiempo</th><th></th></tr></thead><tbody>${E.simulacros.map((s, k) => `<tr><td>${new Date(s.fecha).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' })}</td><td>${esc(SIMULACROS[s.modo].nombre)}</td><td class="num mono">${porcentaje(s.puntaje)}</td><td class="num mono">${Math.round(s.segundos / 60)} min</td><td><a class="btn texto" href="#simulacro-r${k}">Revisar</a></td></tr>`).join('')}</tbody></table></div>` : '<p class="suave">Aún no has presentado simulacros.</p>'}</div></div>`;
  const ab = $('#btnAbandonar');
  if (ab) ab.onclick = async () => { if (await confirmar({ titulo: 'Abandonar simulacro', texto: 'Se perderán las respuestas de este simulacro.', si: 'Abandonar', peligro: true })) { E.simActivo = null; guardarYa(); render(); } };

    guardar(); avisar('Guardado. Los ejercicios nuevos usan este valor.'); render();
  }));
  $('#btnRestablecer').onclick = async () => { if (await confirmar({ titulo: 'Restablecer parámetros', texto: 'Volverán los valores 2026 originales del simulador.', si: 'Restablecer' })) { E.params = {}; cargarParametros(); for (const k in MES_CACHE) delete MES_CACHE[k]; guardar(); render(); } };
  $('#btnReiniciar').onclick = async () => {
    if (!(await confirmar({ titulo: 'Reiniciar todo el progreso', texto: 'Se borrarán diagnósticos, ruta, simulacros, errores y respuestas del caso Mes completo. Esta acción no se puede deshacer.', si: 'Sí, borrar todo', peligro: true }))) return;
    try { localStorage.removeItem(CLAVE); } catch (e) { /* nada */ }
    E = estadoInicial(); cargarParametros(); for (const k in MES_CACHE) delete MES_CACHE[k]; guardarYa(); avisar('Progreso reiniciado.'); ir('diagnostico');
  };
}

/* ---------- Calculadora con cinta ---------- */
function cerrarCalc() { $('#calc').hidden = true; $('#calcFab').setAttribute('aria-expanded', 'false'); }
function iniciarCalc() {
  const fab = $('#calcFab'), calc = $('#calc'), pant = $('#calcPantalla'), cinta = $('#calcCinta');
  fab.innerHTML = icono('calc') + '<span>Calculadora</span>';
  const teclas = ['C', '⌫', '%', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', '0', '000', ',', '='];
  $('#calcTeclas').innerHTML = teclas.map((t) => `<button type="button" class="${'÷×−+%'.includes(t) ? 'op' : t === '=' ? 'igual' : ''}" data-t="${t}">${t}</button>`).join('');
  fab.onclick = () => { calc.hidden = !calc.hidden; fab.setAttribute('aria-expanded', String(!calc.hidden)); };
  $('#calcCerrar').onclick = cerrarCalc;
  const calcular = () => {
    const expr = pant.value.trim(); if (!expr) return;
    const v = evaluarOperacion(expr);
    if (!Number.isFinite(v)) { avisar('Operación no válida.'); return; }
    const r = Math.round(v * 100) / 100;
    const f = document.createElement('div'); f.innerHTML = `<span>${esc(expr)}</span><b>${formatoMonto(r)}</b>`; cinta.appendChild(f); cinta.scrollTop = cinta.scrollHeight;
    pant.value = formatoMonto(r);
  };
  $('#calcTeclas').addEventListener('click', (e) => {
    const t = e.target.closest('[data-t]'); if (!t) return;
    const k = t.dataset.t;
    if (k === 'C') { pant.value = ''; if (!pant.value) cinta.innerHTML = cinta.innerHTML && t.dataset.dos ? '' : cinta.innerHTML; }
    else if (k === '⌫') pant.value = pant.value.slice(0, -1);
    else if (k === '=') calcular();
    else pant.value += k;
  });
  pant.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); calcular(); } });
  $('#calcUsar').onclick = () => {
    const v = leerNumero(pant.value);
    if (!Number.isFinite(v)) { avisar('Primero haz una operación.'); return; }
    if (!ultimoCampo || !document.body.contains(ultimoCampo) || ultimoCampo.disabled) { avisar('Toca primero la casilla donde quieres el valor y vuelve a intentarlo.'); return; }
    ultimoCampo.value = formatoMonto(Math.round(v)); ultimoCampo.dispatchEvent(new Event('input', { bubbles: true }));
    avisar('Valor puesto en la casilla.'); cerrarCalc(); ultimoCampo.focus();
  };
}

/* ---------- Tema claro u oscuro ---------- */
function temaOscuro() { return E.tema ? E.tema === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches; }
function aplicarTema() {
  if (E.tema) document.documentElement.dataset.theme = E.tema; else delete document.documentElement.dataset.theme;
  const b = $('#btnTema'), o = temaOscuro();
  b.innerHTML = o ? icono('sol') : icono('luna'); b.setAttribute('aria-label', o ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
}

/* ---------- Arranque ---------- */
const VISTAS = { inicio: vistaInicio, diagnostico: vistaDiagnostico, ruta: vistaRuta, etapa: vistaEtapa, mes: vistaMes, simulacro: vistaSimulacro, sesion: vistaSesion, casos: vistaCasos, practica: vistaPractica, errores: vistaErrores, datos: vistaDatos };
function iniciar() {
  $('#pucLista').innerHTML = PUC.filter((x) => x.c.length >= 4).map((x) => `<option value="${x.c} — ${esc(x.n)}"></option>`).join('');
  aplicarTema();
  $('#btnTema').onclick = () => { E.tema = temaOscuro() ? 'light' : 'dark'; guardar(); aplicarTema(); };
  iniciarCalc();
  const rel = () => { $('#relojPrueba').textContent = textoReloj(); };
  rel(); setInterval(rel, 30000);
  render();
}
iniciar();
</script>
