<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partida Doble</title>
<meta name="description" content="Simulador contable y administrativo: ciclo contable, caso Mes completo y simulacro de prueba técnica (Colombia, 2026).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Concepto: libro columnario de oficina contable. Papel verde pálido con reglas finas,
   columnas Débito/Crédito separadas por reglas rojas, cifras monoespaciadas alineadas a la derecha
   y doble subrayado en los totales. Tinta azul como acento. */
:root{
  --papel:#EEF3EF; --hoja:#FFFFFF; --hoja-2:#F6F9F6; --tinta:#15211B; --tinta-2:#46564E; --tinta-3:#6E7F76;
  --regla:#D2E0D5; --regla-fuerte:#A7C0AE; --regla-roja:#E0A197;
  --acento:#2743A6; --acento-hover:#1F3688; --acento-tinta:#FFFFFF; --acento-suave:#E4E9FA;
  --ok:#1B7646; --ok-suave:#DDF1E4; --mal:#B0342A; --mal-suave:#F8E1DE; --aviso:#935D06; --aviso-suave:#FAEED3;
  --gris-suave:#E6ECE8; --sombra:0 1px 2px rgb(21 33 27 / .06), 0 8px 24px rgb(21 33 27 / .07);
  --radio:12px; --radio-s:7px;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-texto:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --nav-alto:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papel:#0D1411; --hoja:#141E19; --hoja-2:#18241E; --tinta:#E3ECE6; --tinta-2:#A6B8AD; --tinta-3:#7E9186;
    --regla:#26352D; --regla-fuerte:#3A5044; --regla-roja:#6B3A34;
    --acento:#8FA7FF; --acento-hover:#AFC0FF; --acento-tinta:#0D1411; --acento-suave:#1C2749;
    --ok:#62CF93; --ok-suave:#163125; --mal:#F2897C; --mal-suave:#3B1D1A; --aviso:#EBB64F; --aviso-suave:#3A2D12;
    --gris-suave:#1F2B25; --sombra:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --papel:#0D1411; --hoja:#141E19; --hoja-2:#18241E; --tinta:#E3ECE6; --tinta-2:#A6B8AD; --tinta-3:#7E9186;
  --regla:#26352D; --regla-fuerte:#3A5044; --regla-roja:#6B3A34;
  --acento:#8FA7FF; --acento-hover:#AFC0FF; --acento-tinta:#0D1411; --acento-suave:#1C2749;
  --ok:#62CF93; --ok-suave:#163125; --mal:#F2897C; --mal-suave:#3B1D1A; --aviso:#EBB64F; --aviso-suave:#3A2D12;
  --gris-suave:#1F2B25; --sombra:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.55 var(--f-texto);min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acento)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:30px;font-weight:700}
h2{font-size:23px;font-weight:600}
h3{font-size:18px;font-weight:600}
h4{font-size:15px;font-weight:600}
p{margin:0}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.saltar{position:absolute;left:-999px;top:0;background:var(--acento);color:var(--acento-tinta);padding:8px 12px;z-index:100}
.saltar:focus{left:8px}
.num,.monto{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.suave{color:var(--tinta-2)}
.pequeno{font-size:13px}
.etiqueta{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-3);font-weight:600}

/* ---------- Barra superior ---------- */
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 16px;background:color-mix(in srgb,var(--hoja) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--regla)}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tinta);min-width:0}
.marca-logo{display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;width:38px;height:30px;border:1.5px solid var(--tinta);border-radius:5px;
  font:600 12px/1 var(--f-num);text-align:center;flex:none}
.marca-logo i{height:100%;background:var(--regla-roja)}
.marca b{font-family:var(--f-display);font-size:19px;display:block;line-height:1.05}
.marca small{display:block;font-size:11.5px;color:var(--tinta-3);white-space:nowrap}
.barra-der{display:flex;align-items:center;gap:8px;flex:none}
.marca>span:last-child{min-width:0}
.marca b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){
  .marca small{display:none}
  .marca b{font-size:17px}
  .marca-logo{width:32px;height:28px}
  .reloj{font-size:12px;padding:5px 9px}
  .btn-icono{width:36px;height:36px}
  .linea .l-det{display:none}
  h1{font-size:26px}
}
.reloj{font:500 13px/1.2 var(--f-num);background:var(--acento-suave);color:var(--acento);padding:6px 10px;border-radius:999px;white-space:nowrap}
.btn-icono{width:38px;height:38px;border-radius:10px;border:1px solid var(--regla);background:var(--hoja);display:grid;place-items:center;cursor:pointer}
.btn-icono svg{width:18px;height:18px}

/* ---------- Marco y navegación ---------- */
.marco{display:grid;grid-template-columns:1fr;max-width:1240px;margin:0 auto}
main{min-width:0;padding:20px 16px calc(var(--nav-alto) + 40px + env(safe-area-inset-bottom,0px));outline:none}
.lateral{display:none}
.inferior{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--hoja);
  border-top:1px solid var(--regla);padding-bottom:env(safe-area-inset-bottom,0px)}
.inferior a,.inferior button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--nav-alto);
  text-decoration:none;color:var(--tinta-3);font-size:11.5px;font-weight:500;border:0;background:none;cursor:pointer}
.inferior svg,.lateral svg{width:21px;height:21px}
.inferior .activo{color:var(--acento)}
.inferior span{white-space:nowrap}
@media (min-width:960px){
  .marco{grid-template-columns:232px 1fr}
  .lateral{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(61px + env(safe-area-inset-top,0px));align-self:start;
    height:calc(100vh - 61px);overflow:auto;padding:18px 10px;border-right:1px solid var(--regla)}
  .lateral .grupo{margin:14px 10px 4px}
  .lateral a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--tinta-2);text-decoration:none;font-weight:500}
  .lateral a:hover{background:var(--gris-suave);color:var(--tinta)}
  .lateral a.activo{background:var(--acento-suave);color:var(--acento)}
  .inferior{display:none}
  main{padding:28px 32px 60px}
}
.hoja-mas{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;background:rgb(0 0 0 / .35)}
.hoja-mas .panel{width:100%;background:var(--hoja);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto;animation:subir .18s ease-out}
.hoja-mas .lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.hoja-mas a{display:flex;align-items:center;gap:10px;padding:14px 12px;border:1px solid var(--regla);border-radius:10px;text-decoration:none;color:var(--tinta);font-weight:500}
.hoja-mas a svg{width:20px;height:20px;color:var(--acento);flex:none}
@keyframes subir{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}

/* ---------- Bloques ---------- */
.vista{display:flex;flex-direction:column;gap:18px;animation:aparecer .16s ease-out}
@keyframes aparecer{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
.encabezado{display:flex;flex-direction:column;gap:6px}
.encabezado p{color:var(--tinta-2);max-width:68ch}
.tarjeta{background:var(--hoja);border:1px solid var(--regla);border-radius:var(--radio);padding:18px;box-shadow:var(--sombra);min-width:0}
.tarjeta.plana{box-shadow:none}
.tarjeta h3+p,.tarjeta h2+p{margin-top:6px}
.rejilla{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.rejilla.dos{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.pila{display:flex;flex-direction:column;gap:12px}
.fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fila.entre{justify-content:space-between}
.separador{height:1px;background:var(--regla);margin:4px 0}
.aviso{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--aviso-suave);color:var(--tinta);border:1px solid color-mix(in srgb,var(--aviso) 35%,transparent)}
.aviso.info{background:var(--acento-suave);border-color:color-mix(in srgb,var(--acento) 30%,transparent)}
.aviso.ok{background:var(--ok-suave);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.aviso.mal{background:var(--mal-suave);border-color:color-mix(in srgb,var(--mal) 35%,transparent)}
.aviso b{font-weight:600}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid var(--regla-fuerte);
  background:var(--hoja);color:var(--tinta);font-weight:600;cursor:pointer;text-decoration:none;transition:background .12s,border-color .12s,transform .06s}
.btn:hover{border-color:var(--tinta-3)}
.btn:active{transform:translateY(1px)}
.btn.primario{background:var(--acento);border-color:var(--acento);color:var(--acento-tinta)}
.btn.primario:hover{background:var(--acento-hover);border-color:var(--acento-hover)}
.btn.grande{min-height:56px;font-size:16.5px;padding:14px 20px}
.btn.texto{border-color:transparent;background:none;color:var(--acento);padding-inline:8px}
.btn.peligro{color:var(--mal);border-color:color-mix(in srgb,var(--mal) 45%,transparent)}
.btn.bloque{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--acento-suave);border-color:var(--acento);color:var(--acento)}
.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--gris-suave);color:var(--tinta-2);white-space:nowrap}
.chip.mts{background:var(--acento);color:var(--acento-tinta)}
.chip.rojo{background:var(--mal-suave);color:var(--mal)}
.chip.amarillo{background:var(--aviso-suave);color:var(--aviso)}
.chip.verde{background:var(--ok-suave);color:var(--ok)}
.chip.verificar{background:var(--aviso-suave);color:var(--aviso)}
.chip-btn{border:1px dashed var(--regla-fuerte);background:var(--hoja);cursor:pointer;font-family:var(--f-num);font-weight:500;white-space:normal;text-align:left;line-height:1.3;max-width:100%}
.chip-btn:hover{border-color:var(--acento);color:var(--acento)}

/* ---------- Tablero ---------- */
.portada{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:760px){.portada{grid-template-columns:1.3fr 1fr}}
.cuenta-atras{display:flex;flex-direction:column;gap:10px;background:var(--acento);color:var(--acento-tinta);border-radius:var(--radio);padding:20px;box-shadow:var(--sombra)}
.cuenta-atras .etiqueta{color:inherit;opacity:.8}
.cuenta-atras .cifras{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.cuenta-atras .cifras b{font:600 40px/1 var(--f-num)}
.cuenta-atras .cifras span{font-size:13px;opacity:.85;margin-left:3px}
.mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.mapa a,.mapa div.celda{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:10px;border:1px solid var(--regla);background:var(--hoja-2);text-decoration:none;color:var(--tinta);position:relative;overflow:hidden}
.mapa .n{font:600 12px var(--f-num);color:var(--tinta-3)}
.mapa .t{font-weight:600;font-size:13.5px;line-height:1.25}
.mapa .e{font-size:12px;color:var(--tinta-3)}
.mapa .rojo{border-left:5px solid var(--mal)}
.mapa .amarillo{border-left:5px solid var(--aviso)}
.mapa .verde{border-left:5px solid var(--ok)}
.mapa .gris{border-left:5px solid var(--regla-fuerte)}
.leyenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--tinta-2)}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.barras{display:flex;flex-direction:column;gap:9px}
.barra-tema{display:grid;grid-template-columns:minmax(0,1fr) 110px 46px;gap:10px;align-items:center;font-size:13.5px}
.barra-tema .pista{height:8px;border-radius:999px;background:var(--gris-suave);overflow:hidden}
.barra-tema .pista i{display:block;height:100%;border-radius:999px;background:var(--ok)}
.barra-tema.debil .pista i{background:var(--mal)}
.barra-tema.medio .pista i{background:var(--aviso)}
.dato-grande{font:600 30px/1.1 var(--f-num)}

/* ---------- Progreso y pasos ---------- */
.progreso{height:6px;background:var(--gris-suave);border-radius:999px;overflow:hidden}
.progreso i{display:block;height:100%;background:var(--acento);border-radius:999px;transition:width .25s}
.pasos-ruta{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pasos-ruta button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:9px 10px;border-radius:9px;border:1px solid var(--regla);background:var(--hoja);cursor:pointer;text-align:left;min-width:0}
.pasos-ruta button span{font-size:11px;color:var(--tinta-3);font-family:var(--f-num)}
.pasos-ruta button b{font-size:13px;font-weight:600;line-height:1.2}
.pasos-ruta .hecho{border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:var(--ok-suave)}
.pasos-ruta .actual{border-color:var(--acento);box-shadow:inset 0 0 0 1px var(--acento)}
.pasos-ruta button[disabled]{opacity:.55;cursor:not-allowed}
@media (max-width:520px){.pasos-ruta b{font-size:12px}}

/* ---------- Ítems ---------- */
.item{display:flex;flex-direction:column;gap:14px}
.item-meta{display:flex;gap:6px;flex-wrap:wrap}
.item-q{font-family:var(--f-texto);font-size:17px;font-weight:600;line-height:1.45}
.enunciado{display:flex;flex-direction:column;gap:10px;max-width:78ch}
.enunciado ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.datos{display:grid;grid-template-columns:auto auto;justify-content:start;gap:4px 18px;margin:0;padding:12px 14px;background:var(--hoja-2);border:1px solid var(--regla);border-radius:10px}
.datos dt{color:var(--tinta-2)}
.datos dd{margin:0;font-family:var(--f-num);text-align:right}
@media (max-width:520px){.datos{grid-template-columns:1fr auto;justify-content:stretch}}
.opciones{display:flex;flex-direction:column;gap:8px}
.opcion{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 14px;border-radius:10px;border:1px solid var(--regla-fuerte);background:var(--hoja);cursor:pointer;line-height:1.4;transition:border-color .12s,background .12s}
.opcion:hover{border-color:var(--acento)}
.opcion .tecla{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--gris-suave);font:600 13px var(--f-num)}
.opcion.elegida{border-color:var(--acento);background:var(--acento-suave)}
.opcion.correcta{border-color:var(--ok);background:var(--ok-suave)}
.opcion.incorrecta{border-color:var(--mal);background:var(--mal-suave)}
.opcion[disabled]{cursor:default}
.retro{padding:12px 14px;border-radius:10px;border-left:4px solid var(--acento);background:var(--hoja-2);display:flex;flex-direction:column;gap:6px}
.retro.ok{border-left-color:var(--ok);background:var(--ok-suave)}
.retro.mal{border-left-color:var(--mal);background:var(--mal-suave)}
.retro.medio{border-left-color:var(--aviso);background:var(--aviso-suave)}
.campos{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.campo label{font-size:13px;font-weight:600;color:var(--tinta-2)}
.campo input,.campo select,.entrada{width:100%;min-height:44px;padding:9px 12px;border-radius:9px;border:1px solid var(--regla-fuerte);background:var(--hoja);font-size:16px}
.campo input.monto{font-family:var(--f-num)}
.campo .nota{font-size:12.5px;color:var(--tinta-2)}
.campo.ok input,.campo.ok select{border-color:var(--ok);background:var(--ok-suave)}
.campo.mal input,.campo.mal select{border-color:var(--mal);background:var(--mal-suave)}
.campo .res{font-size:12.5px}
.campo.ok .res{color:var(--ok)}
.campo.mal .res{color:var(--mal)}
.acciones{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.solucion{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:12px;background:var(--hoja-2);border:1px dashed var(--regla-fuerte)}
.pasos{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.pasos li::marker{font-family:var(--f-num);color:var(--tinta-3)}
.sugeridas{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* ---------- Libro diario ---------- */
.asiento{display:flex;flex-direction:column;gap:8px}
.asiento-cab{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.asiento-cab h4{font-size:15.5px}
.diario{border:1px solid var(--regla-fuerte);border-radius:10px;background:var(--hoja);overflow:hidden}
.diario-cab{display:none}
.linea{display:grid;gap:6px;padding:10px;border-bottom:1px solid var(--regla);position:relative;
  grid-template-columns:1fr 1fr 38px;grid-template-areas:"cod cod quitar" "nom nom nom" "deb cre cre" "det det det" "msg msg msg"}
.linea .l-fecha{display:none}
.linea .l-cod{grid-area:cod;min-width:0}
.linea .l-nombre{grid-area:nom;font-size:12.5px;color:var(--tinta-2);min-height:1em;line-height:1.3}
.linea .l-d{grid-area:deb}
.linea .l-h{grid-area:cre}
.linea .l-det{grid-area:det}
.linea .l-quitar{grid-area:quitar}
.linea .l-msg{grid-area:msg;font-size:12.5px;font-weight:500}
.linea .l-msg:empty{display:none}
.linea input{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--regla);border-radius:7px;background:var(--hoja);font-size:16px;min-width:0}
.linea input.monto{font-family:var(--f-num)}
.linea .l-d{border-right:3px double var(--regla-roja)}
.linea .l-quitar{border:0;background:none;color:var(--tinta-3);font-size:22px;cursor:pointer;border-radius:7px}
.linea .l-quitar:hover{background:var(--mal-suave);color:var(--mal)}
.linea.es-ok{background:var(--ok-suave);box-shadow:inset 4px 0 0 var(--ok)}
.linea.es-mal{background:var(--mal-suave);box-shadow:inset 4px 0 0 var(--mal)}
.linea.es-lado{background:var(--aviso-suave);box-shadow:inset 4px 0 0 var(--aviso)}
.linea.es-ok .l-msg{color:var(--ok)}
.linea.es-mal .l-msg{color:var(--mal)}
.linea.es-lado .l-msg{color:var(--aviso)}
.diario-pie{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;background:var(--hoja-2)}

  { id: 'CA06', t: 'causacion', e: 3, q: 'Un cliente paga por anticipado la mensualidad del próximo mes del parqueadero. ¿Qué cuenta acreditas?', o: ['2805 Anticipos y avances recibidos', '4155 Ingresos operacionales', '1305 Clientes', '1330 Anticipos y avances'], r: 0, x: 'El servicio aún no se ha prestado, así que no es ingreso: es un pasivo (2805). El ingreso se reconoce cuando se presta el servicio.' },
  { id: 'CA07', t: 'causacion', e: 3, q: 'Entregas un anticipo a un contratista antes de que empiece la obra. ¿Qué cuenta debitas?', o: ['1330 Anticipos y avances', '2805 Anticipos y avances recibidos', '5145 Mantenimiento y reparaciones', '2205 Proveedores'], r: 0, x: 'El anticipo entregado es un derecho (activo) hasta que el contratista legalice con su factura.' },
  { id: 'CA08', t: 'causacion', e: 2, mts: 1, q: '¿Qué documento soporta la salida de dinero por el pago a un proveedor?', o: ['Comprobante de egreso', 'Recibo de caja', 'Nota crédito', 'Factura de venta'], r: 0, x: 'El comprobante de egreso respalda los pagos; el recibo de caja respalda los ingresos de dinero.' },
  { id: 'CA09', t: 'causacion', e: 2, q: '¿Qué documento usas para registrar un ajuste que no mueve dinero, como la depreciación del mes?', o: ['Nota de contabilidad (comprobante de ajuste)', 'Comprobante de egreso', 'Recibo de caja', 'Consignación'], r: 0, x: 'Las notas de contabilidad soportan ajustes, provisiones, reversiones y reclasificaciones.' },
  { id: 'CA10', t: 'causacion', e: 2, q: 'Un cliente devuelve parte del servicio facturado y hay que disminuir la factura. ¿Qué documento se emite?', o: ['Nota crédito electrónica', 'Nota débito electrónica', 'Documento soporte', 'Recibo de caja'], r: 0, x: 'La nota crédito disminuye el valor de una factura (devoluciones, descuentos, anulaciones). La nota débito lo aumenta.' },
  { id: 'CA11', t: 'causacion', e: 3, q: '¿Qué principio exige que todo asiento tenga débitos iguales a créditos?', o: ['Partida doble', 'Negocio en marcha', 'Prudencia', 'Esencia sobre la forma'], r: 0, x: 'Por partida doble, cada transacción afecta al menos dos cuentas y las sumas débito y crédito son iguales.' },
  { id: 'CA12', t: 'causacion', e: 2, q: '¿Qué documento recibes del banco para verificar los movimientos del mes?', o: ['Extracto bancario', 'Recibo de caja', 'Comprobante de egreso', 'Nota contable'], r: 0, x: 'El extracto es la base de la conciliación bancaria.' },
  { id: 'CA13', t: 'causacion', e: 2, q: '¿Qué documento soporta el ingreso de dinero por el pago de un cliente?', o: ['Recibo de caja', 'Comprobante de egreso', 'Documento soporte', 'Nota débito'], r: 0, x: 'El recibo de caja registra el recaudo y la aplicación a la factura del cliente.' },

  // 2. Retenciones e impuestos
  { id: 'IM01', t: 'impuestos', mts: 1, q: 'Con UVT 2026 de $ 52.374, ¿cuál es la base mínima de retención en la fuente para compras (27 UVT)?', o: ['$ 1.414.098', '$ 209.496', '$ 1.309.350', '$ 1.571.220'], r: 0, x: '27 × 52.374 = 1.414.098.' },
  { id: 'IM02', t: 'impuestos', mts: 1, q: '¿Cuál es la base mínima para servicios generales (4 UVT) en 2026?', o: ['$ 209.496', '$ 157.122', '$ 261.870', '$ 1.414.098'], r: 0, x: '4 × 52.374 = 209.496.' },
  { id: 'IM03', t: 'impuestos', q: 'Compras papelería por $ 1.200.000 antes de IVA a un proveedor declarante. ¿Cuánto le retienes en la fuente?', o: ['$ 0, porque la base es menor que 27 UVT', '$ 30.000', '$ 42.000', '$ 48.000'], r: 0, x: '1.200.000 es menor que $ 1.414.098 (27 UVT), así que no se practica retención.' },
  { id: 'IM04', t: 'impuestos', mts: 1, q: 'Servicio de mantenimiento por $ 800.000 + IVA a un proveedor declarante. ¿Cuál es la retención en la fuente?', o: ['$ 32.000', '$ 48.000', '$ 20.000', '$ 38.080'], r: 0, x: '800.000 × 4 % = 32.000. Se calcula sobre la base, sin IVA.' },
  { id: 'IM05', t: 'impuestos', q: '¿Sobre qué valor se calcula la retención en la fuente?', o: ['Sobre la base gravable, sin incluir el IVA', 'Sobre el total de la factura con IVA', 'Sobre el IVA', 'Sobre el neto a pagar'], r: 0, x: 'La retención en la fuente se liquida sobre el valor del pago antes de IVA.' },
  { id: 'IM06', t: 'impuestos', mts: 1, q: 'Tu empresa es gran contribuyente y compra a un responsable de IVA. El IVA de la factura es $ 190.000. ¿Cuál es la reteIVA?', o: ['$ 28.500', '$ 19.000', '$ 36.100', '$ 15.000'], r: 0, x: '190.000 × 15 % = 28.500.' },
  { id: 'IM07', t: 'impuestos', q: '¿En qué cuenta registra una empresa la retención en la fuente que LE PRACTICAN sus clientes?', o: ['1355 Anticipo de impuestos', '2365 Retención en la fuente', '2367 IVA retenido', '4155 Ingresos'], r: 0, x: 'Es un anticipo de su impuesto de renta (activo, 1355). 2365 es la retención que la empresa practica a otros (pasivo).' },
  { id: 'IM08', t: 'impuestos', q: '¿En qué cuenta registras la retención en la fuente que TÚ practicas a un proveedor?', o: ['2365 Retención en la fuente', '1355 Anticipo de impuestos', '2408 IVA por pagar', '5115 Impuestos'], r: 0, x: 'Es una deuda con la DIAN que se declara y paga en el formulario 350.' },
  { id: 'IM09', t: 'impuestos', mts: 1, q: 'ReteICA Bogotá: servicio con base de $ 2.000.000 y tarifa de 9,66 por mil. ¿Cuánto retienes?', o: ['$ 19.320', '$ 193.200', '$ 1.932', '$ 9.660'], r: 0, x: '2.000.000 × 9,66 ÷ 1.000 = 19.320.' },
  { id: 'IM10', t: 'impuestos', mts: 1, q: '¿Cuánto es el GMF de un pago de $ 5.000.000?', o: ['$ 20.000', '$ 4.000', '$ 40.000', '$ 2.000'], r: 0, x: '5.000.000 × 4 ÷ 1.000 = 20.000.' },
  { id: 'IM11', t: 'impuestos', q: 'Honorarios de $ 3.000.000 a una persona jurídica. ¿Cuál es la retención en la fuente?', o: ['$ 330.000', '$ 300.000', '$ 120.000', '$ 105.000'], r: 0, x: 'Honorarios a persona jurídica: 11 %, sin base mínima.' },
  { id: 'IM12', t: 'impuestos', q: 'Arriendo de un local comercial por $ 4.000.000 + IVA. ¿Cuál es la retención en la fuente?', o: ['$ 140.000', '$ 160.000', '$ 100.000', '$ 0'], r: 0, x: 'Arrendamiento de inmuebles: 3,5 % → 4.000.000 × 3,5 % = 140.000.' },
  { id: 'IM13', t: 'impuestos', q: 'El IVA generado del bimestre es $ 9.500.000 y el IVA descontable $ 6.200.000. ¿Cuánto IVA se paga?', o: ['$ 3.300.000', '$ 15.700.000', '$ 6.200.000', '$ 9.500.000'], r: 0, x: 'IVA a pagar = generado − descontable = 3.300.000.' },
  { id: 'IM14', t: 'impuestos', q: 'Un proveedor NO declarante presta un servicio de $ 600.000. ¿Qué tarifa de retención aplicas?', o: ['6 %', '4 %', '3,5 %', '11 %'], r: 0, x: 'Servicios generales a no declarantes: 6 %.' },
  { id: 'IM15', t: 'impuestos', q: 'Compra de bienes por $ 2.000.000 a un proveedor no declarante. ¿Cuál es la retención?', o: ['$ 70.000', '$ 50.000', '$ 80.000', '$ 120.000'], r: 0, x: 'Compras a no declarantes: 3,5 % → 70.000.' },
  { id: 'IM16', t: 'impuestos', q: '¿Con qué frecuencia se declara y paga la retención en la fuente?', o: ['Mensual (formulario 350)', 'Bimestral (formulario 300)', 'Anual (formulario 110)', 'Cuatrimestral'], r: 0, x: 'La retención en la fuente es mensual, en el formulario 350.' },
  { id: 'IM17', t: 'impuestos', q: '¿Qué formulario de la DIAN se usa para declarar IVA?', o: ['Formulario 300', 'Formulario 350', 'Formulario 110', 'Formulario 220'], r: 0, x: '300 es IVA; 350, retención en la fuente; 110, renta de personas jurídicas; 220, certificado de ingresos y retenciones laborales.' },

  // 3. Facturación y documentos electrónicos
  { id: 'FE01', t: 'facturacion', mts: 1, q: '¿Qué es el CUFE?', o: ['El Código Único de Factura Electrónica que identifica cada factura validada', 'El número de la resolución de facturación', 'El código del software de facturación', 'La firma digital del contador'], r: 0, x: 'El CUFE identifica de forma única cada factura electrónica; permite consultarla en la DIAN.' },
  { id: 'FE02', t: 'facturacion', mts: 1, q: 'Un parqueadero cobra 50 mensualidades iguales cada mes y además cobra por horas según el uso. ¿Cómo se clasifican estas facturaciones?', o: ['Mensualidades: facturación fija; horas: facturación variable', 'Ambas son facturación fija', 'Ambas son variables', 'Mensualidades: variable; horas: fija'], r: 0, x: 'La fija se repite con el mismo valor cada periodo; la variable depende del uso (horas, días, eventos).' },
  { id: 'FE03', t: 'facturacion', e: 2, mts: 1, q: 'Compras un servicio a una persona natural no obligada a facturar. ¿Qué documento electrónico emites para soportar el costo?', o: ['Documento soporte en adquisiciones a no obligados a facturar', 'Factura electrónica de venta', 'Nota débito', 'Tiquete POS'], r: 0, x: 'El documento soporte lo emite el comprador y se transmite a la DIAN; sin él, el costo no es deducible.' },
  { id: 'FE04', t: 'facturacion', mts: 1, q: '¿Qué es la nómina electrónica?', o: ['El documento soporte de pago de nómina que el empleador transmite a la DIAN', 'El pago de la nómina por archivo plano', 'La planilla PILA', 'El desprendible que se entrega al trabajador'], r: 0, x: 'El documento soporte de pago de nómina electrónica respalda el costo laboral y se transmite a la DIAN cada mes.' },
  { id: 'FE05', t: 'facturacion', mts: 1, q: '¿Qué significa “validación previa” en la facturación electrónica colombiana?', o: ['La DIAN valida la factura antes de que se entregue al adquirente', 'El cliente aprueba la factura antes de emitirla', 'El contador revisa la factura cada mes', 'El banco valida la factura antes de pagarla'], r: 0, x: 'Solo la factura validada por la DIAN tiene efectos fiscales y se entrega al cliente.' },
  { id: 'FE06', t: 'facturacion', mts: 1, q: '¿Qué es RADIAN?', o: ['El registro de facturas electrónicas como título valor para negociarlas (factoring)', 'El software gratuito de la DIAN para facturar', 'El registro único tributario', 'El sistema de nómina electrónica'], r: 0, x: 'RADIAN registra la circulación de la factura electrónica como título valor.' },
  { id: 'FE07', t: 'facturacion', e: 2, mts: 1, q: 'Emitiste una factura con un valor mayor al correcto. ¿Cómo lo corriges?', o: ['Con una nota crédito electrónica que referencia la factura', 'Borrando la factura del software', 'Emitiendo una nota débito', 'Con un recibo de caja'], r: 0, x: 'La factura validada no se borra ni se anula: se corrige con nota crédito (disminuye) o nota débito (aumenta).' },
  { id: 'FE08', t: 'facturacion', mts: 1, q: '¿Qué nota se usa para cobrar intereses de mora o un mayor valor sobre una factura ya emitida?', o: ['Nota débito', 'Nota crédito', 'Documento soporte', 'Nota de ajuste de nómina'], r: 0, x: 'La nota débito aumenta el valor de una factura ya emitida.' },
  { id: 'FE09', t: 'facturacion', mts: 1, q: 'Si el comprador no reclama, ¿en qué plazo opera la aceptación tácita de la factura electrónica como título valor?', o: ['3 días hábiles después de recibir la mercancía o el servicio', '30 días calendario', '1 día hábil', '15 días hábiles'], r: 0, x: 'Pasados 3 días hábiles sin reclamo se entiende aceptada tácitamente (Decreto 1154 de 2020).' },
  { id: 'FE10', t: 'facturacion', mts: 1, q: '¿Qué información es obligatoria en una factura electrónica de venta?', o: ['NIT del emisor y del adquirente, fecha, descripción, valores, IVA y CUFE', 'Solo el valor total', 'El número de cuenta bancaria del cliente', 'La firma manuscrita del representante legal'], r: 0, x: 'Son requisitos del art. 617 ET y de la resolución de facturación electrónica.' },
  { id: 'FE11', t: 'facturacion', mts: 1, q: '¿Qué son los “eventos” de la factura electrónica (acuse de recibo, recibo del bien y aceptación)?', o: ['Mensajes electrónicos que registran lo que pasa con la factura después de emitida', 'Las promociones del mes', 'Los cambios en la resolución de facturación', 'Los errores de validación'], r: 0, x: 'Los eventos se transmiten a la DIAN y son necesarios para que la factura sea título valor.' },
  { id: 'FE12', t: 'facturacion', mts: 1, q: '¿En qué plazo se transmite el documento soporte de pago de nómina electrónica?', o: ['Dentro de los 10 primeros días hábiles del mes siguiente al pago', 'El mismo día del pago', 'Una vez al año', 'Cada quincena antes de pagar'], r: 0, x: 'Resolución DIAN 000013 de 2021. Verifica el calendario vigente.' },
  { id: 'FE13', t: 'facturacion', e: 2, mts: 1, q: 'Recibes la factura electrónica de un proveedor. Antes de causarla, ¿qué verificas?', o: ['Que esté validada por la DIAN (CUFE), que tus datos estén bien y que coincida con la orden o el servicio recibido', 'Solo que tenga el logo del proveedor', 'Solo el valor total', 'Que venga firmada en papel'], r: 0, x: 'Validar antes de causar evita registrar facturas inválidas o duplicadas.' },

  // 4. Conciliación bancaria y de recaudos
  { id: 'CO01', t: 'conciliacion', e: 7, mts: 1, q: 'Un cheque girado aún no cobrado, ¿cómo afecta la conciliación?', o: ['Se resta del saldo del extracto', 'Se suma al saldo del extracto', 'Se resta del saldo en libros', 'Se suma al saldo en libros'], r: 0, x: 'La empresa ya lo restó en libros, pero el banco todavía no lo ha pagado.' },
  { id: 'CO02', t: 'conciliacion', e: 7, mts: 1, q: 'Una consignación registrada en libros el día 30, que el banco abonó el día 1 del mes siguiente, es:', o: ['Consignación en tránsito: se suma al saldo del extracto', 'Nota débito: se resta en libros', 'Cheque pendiente: se resta del extracto', 'Nota crédito: se suma en libros'], r: 0, x: 'Ya está en libros y falta en el banco: se suma al extracto.' },
  { id: 'CO03', t: 'conciliacion', e: 7, mts: 1, q: 'El extracto muestra una comisión bancaria que no está en libros. ¿Qué haces?', o: ['Registrar una nota contable: débito 5305 gastos financieros, crédito 1110 Bancos', 'Restarla del saldo del extracto', 'Sumarla al saldo en libros', 'Esperar al mes siguiente sin registrar'], r: 0, x: 'Lo que el banco registró y la empresa no se ajusta en libros con un asiento.' },
  { id: 'CO04', t: 'conciliacion', e: 7, mts: 1, q: 'El banco abonó intereses por $ 35.000 que no están en libros. ¿Cómo quedan en la conciliación?', o: ['Se suman al saldo en libros y se registran: débito 1110, crédito 4210', 'Se restan del extracto', 'Se restan del saldo en libros', 'No se registran porque son del banco'], r: 0, x: 'Es una nota crédito: aumenta bancos en libros y es un ingreso financiero.' },
  { id: 'CO05', t: 'conciliacion', e: 7, mts: 1, q: 'En el parqueadero, el software reporta $ 3.450.000 en efectivo del día, pero la consignación fue de $ 3.400.000. ¿Qué haces primero?', o: ['Verificar el arqueo, el cierre del cajero y la consignación para establecer si es un faltante o un error de registro', 'Registrar $ 50.000 como ingreso', 'Ajustar el reporte del software', 'Ignorar la diferencia por ser pequeña'], r: 0, x: 'Primero se establece la causa con soportes; luego se registra (por ejemplo, cuenta por cobrar al cajero).' },
  { id: 'CO06', t: 'conciliacion', e: 7, mts: 1, q: 'Las ventas con datáfono del día fueron $ 2.000.000 y el banco abonó $ 1.952.400. ¿A qué corresponde normalmente la diferencia?', o: ['A la comisión del datáfono, su IVA y, si aplica, las retenciones de la red de pagos', 'A un faltante del cajero', 'A una consignación en tránsito', 'A un cheque pendiente'], r: 0, x: 'En este caso: comisión 2 % (40.000) + IVA (7.600) = 47.600.' },
  { id: 'CO07', t: 'conciliacion', e: 7, mts: 1, q: 'Saldo en el extracto $ 10.000.000; cheques pendientes $ 1.500.000; consignación en tránsito $ 700.000. ¿Cuál es el saldo ajustado?', o: ['$ 9.200.000', '$ 10.800.000', '$ 12.200.000', '$ 7.800.000'], r: 0, x: '10.000.000 − 1.500.000 + 700.000 = 9.200.000.' },
  { id: 'CO08', t: 'conciliacion', e: 7, mts: 1, q: '¿Qué partidas conciliatorias generan asiento contable en libros?', o: ['Las que el banco registró y la empresa no (notas débito, notas crédito y errores en libros)', 'Los cheques pendientes de cobro', 'Las consignaciones en tránsito', 'Ninguna: la conciliación nunca genera asientos'], r: 0, x: 'Cheques pendientes y consignaciones en tránsito son diferencias de tiempo: no llevan asiento.' },
  { id: 'CO09', t: 'conciliacion', e: 7, mts: 1, q: 'Se registró en libros un cheque por $ 1.250.000, pero el banco lo pagó por $ 1.520.000 (el valor correcto). ¿Qué ajuste va en libros?', o: ['Disminuir bancos en $ 270.000 (crédito 1110)', 'Aumentar bancos en $ 270.000', 'Sumar $ 270.000 al extracto', 'No hacer nada'], r: 0, x: 'En libros falta restar 270.000. Una diferencia divisible por 9 suele indicar transposición de cifras.' },
  { id: 'CO10', t: 'conciliacion', e: 7, mts: 1, q: '¿Qué verificas al conciliar la cuenta 2205 Proveedores contra el auxiliar por tercero?', o: ['Que la suma de saldos por proveedor sea igual al saldo del mayor y que no haya saldos débito sin explicar', 'Solo el saldo del proveedor más grande', 'Que coincida con el extracto bancario', 'Que todos los proveedores tengan saldo cero'], r: 0, x: 'El auxiliar por tercero debe sumar exactamente el saldo de la cuenta.' },
  { id: 'CO11', t: 'conciliacion', e: 7, mts: 1, q: 'Aparece en el extracto una transferencia y no se sabe quién pagó. ¿Qué haces?', o: ['Registrarla en una cuenta transitoria de pasivo (por ejemplo, 2895 consignaciones por identificar) e investigar con el banco y los clientes', 'Registrarla como ingreso del mes', 'Dejarla sin registrar indefinidamente', 'Devolverla al banco'], r: 0, x: 'No es ingreso hasta identificar el origen; lo usual es una cuenta transitoria y luego aplicarla a la cartera.' },
  { id: 'CO12', t: 'conciliacion', e: 7, q: '¿Con qué frecuencia se recomienda conciliar bancos?', o: ['Cada mes, como mínimo, al cierre', 'Solo al final del año', 'Solo cuando hay diferencias', 'Cada cinco años'], r: 0, x: 'La conciliación mensual permite detectar a tiempo errores, fraudes y partidas sin registrar.' },

  // 5. Ajustes, provisiones y reversiones
  { id: 'AJ01', t: 'ajustes', e: 6, mts: 1, q: 'Los servicios públicos del mes llegan facturados el mes siguiente. ¿Qué haces al cierre?', o: ['Provisionar (débito 5135, crédito 2335) y reversar al recibir la factura', 'No registrar nada hasta que llegue la factura', 'Registrar el gasto en el mes siguiente', 'Debitar 2335 y acreditar 5135'], r: 0, x: 'Por devengo el gasto pertenece al mes en que se consumió.' },
  { id: 'AJ02', t: 'ajustes', e: 6, q: 'Un equipo costó $ 12.000.000, sin valor residual y con vida útil de 5 años. ¿Cuál es la depreciación mensual en línea recta?', o: ['$ 200.000', '$ 2.400.000', '$ 240.000', '$ 100.000'], r: 0, x: '12.000.000 ÷ 60 meses = 200.000.' },
  { id: 'AJ03', t: 'ajustes', e: 6, q: 'Pagaste el 1 de enero un seguro anual de $ 6.000.000. ¿Cuál es el ajuste mensual?', o: ['Débito 5130 Seguros $ 500.000 / crédito 1705 $ 500.000', 'Débito 1705 / crédito 5130 por $ 6.000.000', 'Débito 5130 por $ 6.000.000 en enero', 'Débito 2335 / crédito 1705'], r: 0, x: 'Cada mes se amortiza la doceava parte consumida.' },
  { id: 'AJ04', t: 'ajustes', e: 6, mts: 1, q: 'Prestaste en septiembre el servicio de administración de un edificio que facturarás en octubre. ¿Qué registras al cierre de septiembre?', o: ['Un ingreso devengado: débito 1345 Ingresos por cobrar, crédito 4155', 'Nada, porque no hay factura', 'Un anticipo recibido', 'Un gasto por pagar'], r: 0, x: 'El ingreso se reconoce cuando se presta el servicio; en octubre se reversa y se factura.' },
  { id: 'AJ05', t: 'ajustes', e: 6, mts: 1, q: '¿Para qué sirve reversar una provisión al inicio del mes siguiente?', o: ['Para que, al registrar la factura real, el gasto no quede duplicado y solo se refleje la diferencia', 'Para eliminar el gasto del año', 'Para aumentar la utilidad del mes anterior', 'Porque la DIAN lo exige en el formulario 350'], r: 0, x: 'La reversión anula la estimación y deja que la factura real quede registrada completa.' },
  { id: 'AJ06', t: 'ajustes', e: 6, mts: 1, q: '¿Cuál es el asiento de reversión de una provisión de servicios por $ 900.000?', o: ['Débito 2335 $ 900.000 / crédito 5135 $ 900.000', 'Débito 5135 / crédito 2335', 'Débito 1110 / crédito 2335', 'Débito 2335 / crédito 1110'], r: 0, x: 'La reversión es el asiento contrario a la provisión.' },
  { id: 'AJ07', t: 'ajustes', e: 6, q: '¿Qué cuenta se acredita al registrar la provisión mensual de prestaciones sociales?', o: ['2610 Para obligaciones laborales (o 2510–2525, según la política)', '5105 Gastos de personal', '2505 Salarios por pagar', '1330 Anticipos'], r: 0, x: 'El gasto va a 5105 y la obligación estimada a 2610 o a las cuentas consolidadas.' },
  { id: 'AJ08', t: 'ajustes', e: 6, mts: 1, q: 'Provisionaste $ 1.000.000 de energía; reversaste la provisión y la factura real llegó por $ 1.080.000. ¿Cuánto gasto de energía queda en el mes siguiente?', o: ['$ 80.000', '$ 1.080.000', '$ 1.000.000', '$ 2.080.000'], r: 0, x: 'Reversión −1.000.000 + factura 1.080.000 = +80.000.' },
  { id: 'AJ09', t: 'ajustes', e: 6, q: '¿Qué principio justifica registrar gastos causados aunque no se hayan facturado ni pagado?', o: ['Devengo o causación', 'Negocio en marcha', 'Uniformidad', 'Materialidad'], r: 0, x: 'Los hechos se reconocen cuando ocurren, no cuando se pagan.' },
  { id: 'AJ10', t: 'ajustes', e: 6, q: 'Un vehículo de $ 80.000.000 tiene valor residual de $ 8.000.000 y vida útil de 6 años. ¿Cuál es la depreciación mensual?', o: ['$ 1.000.000', '$ 1.111.111', '$ 12.000.000', '$ 1.333.333'], r: 0, x: '(80.000.000 − 8.000.000) ÷ 72 meses = 1.000.000.' },
  { id: 'AJ11', t: 'ajustes', e: 6, q: 'Con una base prestacional de $ 2.000.000 (salario + auxilio), ¿cuánto se provisiona de cesantías en el mes?', o: ['$ 166.600', '$ 200.000', '$ 83.400', '$ 20.000'], r: 0, x: '2.000.000 × 8,33 % = 166.600.' },
  { id: 'AJ12', t: 'ajustes', e: 6, q: '¿Sobre qué base se calcula la provisión de vacaciones?', o: ['Solo sobre el salario (sin auxilio de transporte), al 4,17 %', 'Salario más auxilio de transporte, al 8,33 %', 'Solo sobre el auxilio de transporte', 'Sobre el neto pagado'], r: 0, x: 'El auxilio de transporte no es base para vacaciones.' },

  // 6. Análisis de cuentas, balance de prueba y cierre
  { id: 'AN01', t: 'analisis', e: 8, mts: 1, q: 'Proveedores muestra saldo débito. ¿Qué puede indicar?', o: ['Un anticipo, un pago doble o un error de imputación: hay que analizarlo y reclasificar', 'Que todo está correcto', 'Que hay más proveedores', 'Que se debe pagar más'], r: 0, x: 'Un saldo contrario a la naturaleza siempre se analiza y se documenta.' },
  { id: 'AN02', t: 'analisis', e: 8, mts: 1, q: 'Clientes (1305) muestra saldo crédito para un cliente. ¿Qué es lo más probable?', o: ['Un anticipo o un pago mayor recibido; se reclasifica a 2805 si corresponde', 'Una venta normal', 'Una provisión de cartera', 'Una depreciación'], r: 0, x: 'Un cliente con saldo a favor es un pasivo para la empresa.' },
  { id: 'AN03', t: 'analisis', e: 8, mts: 1, q: 'Caja presenta saldo crédito. ¿Qué significa?', o: ['Es imposible físicamente: indica un error de registro (egresos de más o ingresos no registrados)', 'Que hay mucho efectivo', 'Que se consignó de más', 'Que es normal al cierre'], r: 0, x: 'No se puede tener menos de cero pesos en caja.' },
  { id: 'AN04', t: 'analisis', e: 8, mts: 1, q: 'El gasto de mantenimiento del mes es tres veces el promedio de los meses anteriores. ¿Qué haces?', o: ['Revisar la razonabilidad: soportes, facturas duplicadas o mal imputadas (por ejemplo, un activo registrado como gasto)', 'Nada, los gastos varían', 'Reversar el gasto', 'Trasladarlo a ingresos'], r: 0, x: 'El análisis de razonabilidad compara con meses anteriores y busca la explicación con soportes.' },
  { id: 'AN05', t: 'analisis', e: 8, mts: 1, q: 'Una reparación de talanqueras se registró en 5135 Servicios en vez de 5145 Mantenimiento. ¿Cuál es la nota de reclasificación?', o: ['Débito 5145 / crédito 5135', 'Débito 5135 / crédito 5145', 'Débito 5145 / crédito 1110', 'Débito 2335 / crédito 5145'], r: 0, x: 'Se lleva el valor a la cuenta correcta (débito) y se saca de la equivocada (crédito).' },
  { id: 'AN06', t: 'analisis', e: 5, mts: 1, q: 'En el balance de prueba los débitos superan a los créditos en $ 270.000, cifra divisible por 9. ¿Qué error es probable?', o: ['Una transposición de cifras (por ejemplo, $ 520.000 registrado como $ 250.000)', 'Un asiento completo omitido', 'El valor correcto en una cuenta equivocada del mismo lado', 'Un error de redondeo'], r: 0, x: '520.000 − 250.000 = 270.000 = 9 × 30.000. Omitir un asiento completo no descuadra el balance.' },
  { id: 'AN07', t: 'analisis', e: 5, q: '¿Qué error NO se detecta con el balance de prueba?', o: ['Registrar el valor correcto en una cuenta equivocada del mismo lado', 'Registrar un débito sin su crédito', 'Sumar mal una columna', 'Pasar un valor al lado contrario'], r: 0, x: 'Si débitos y créditos siguen iguales, el balance de prueba cuadra aunque la cuenta esté mal.' },
  { id: 'AN08', t: 'analisis', e: 5, q: 'Los créditos exceden a los débitos en $ 1.600.000 y encuentras un gasto de $ 800.000 registrado al crédito. ¿Por qué tiene sentido?', o: ['Un valor pasado al lado contrario genera una diferencia del doble de su valor', 'Porque la diferencia es divisible por 9', 'Porque falta un asiento completo', 'No tiene relación'], r: 0, x: 'Faltan 800.000 al débito y sobran 800.000 al crédito: diferencia de 1.600.000.' },
  { id: 'AN09', t: 'analisis', e: 9, q: '¿Qué cuentas componen el estado de resultados?', o: ['Clases 4, 5, 6 y 7 (ingresos, gastos y costos)', 'Clases 1, 2 y 3', 'Solo la clase 1', 'Clases 8 y 9'], r: 0, x: 'Las clases 1, 2 y 3 van al estado de situación financiera.' },
  { id: 'AN10', t: 'analisis', e: 9, q: 'Ingresos del mes $ 30.000.000; gastos $ 24.500.000. ¿Cuál es la utilidad y dónde se presenta en el estado de situación financiera?', o: ['$ 5.500.000, en el patrimonio como utilidad del ejercicio', '$ 5.500.000, en el pasivo', '$ 54.500.000, en el activo', '$ 24.500.000, en el patrimonio'], r: 0, x: 'La utilidad aumenta el patrimonio (3605).' },
  { id: 'AN11', t: 'analisis', e: 10, q: '¿Qué cuentas se cancelan en el cierre contable?', o: ['Las de resultado (ingresos, gastos y costos), contra la utilidad o pérdida del ejercicio', 'Las de activo', 'Las de pasivo', 'Las de patrimonio'], r: 0, x: 'Las cuentas nominales quedan en cero y su resultado pasa al patrimonio.' },
  { id: 'AN12', t: 'analisis', e: 10, q: 'Al cierre, los ingresos son $ 50.000.000 y los gastos $ 42.000.000. ¿Cómo queda el asiento de cierre?', o: ['Débito ingresos 50.000.000; crédito gastos 42.000.000; crédito 3605 Utilidad del ejercicio 8.000.000', 'Débito gastos; crédito ingresos; débito 3605', 'Débito 3605 8.000.000; crédito 1110', 'Débito 1110 8.000.000; crédito 3605'], r: 0, x: 'Se debita lo que tiene saldo crédito (ingresos) y se acredita lo que tiene saldo débito (gastos); la diferencia es la utilidad.' },
  { id: 'AN13', t: 'analisis', e: 4, q: 'La cuenta 1110 Bancos tiene saldo inicial de $ 5.000.000, débitos por $ 12.000.000 y créditos por $ 9.500.000. ¿Cuál es el saldo final?', o: ['$ 7.500.000 débito', '$ 7.500.000 crédito', '$ 26.500.000 débito', '$ 2.500.000 débito'], r: 0, x: '5.000.000 + 12.000.000 − 9.500.000 = 7.500.000 (naturaleza débito).' },
  { id: 'AN14', t: 'analisis', e: 4, q: '¿Qué es mayorizar?', o: ['Trasladar los valores de los asientos del libro diario a cada cuenta del mayor para obtener su saldo', 'Elaborar el estado de resultados', 'Hacer la conciliación bancaria', 'Calcular el IVA'], r: 0, x: 'El libro mayor (o las cuentas T) agrupa los movimientos por cuenta.' },
  { id: 'AN15', t: 'analisis', e: 4, q: 'La cuenta 2205 Proveedores tiene saldo inicial de $ 8.000.000, créditos por $ 5.000.000 y débitos por $ 6.500.000. ¿Saldo final?', o: ['$ 6.500.000 crédito', '$ 9.500.000 crédito', '$ 6.500.000 débito', '$ 19.500.000 crédito'], r: 0, x: '8.000.000 + 5.000.000 − 6.500.000 = 6.500.000 (naturaleza crédito).' },
  { id: 'AN16', t: 'analisis', e: 9, q: '¿Dónde se clasifica 1705 Gastos pagados por anticipado de un seguro de 12 meses?', o: ['Activo corriente', 'Pasivo corriente', 'Patrimonio', 'Gasto del mes'], r: 0, x: 'Se consumirá en menos de 12 meses: activo corriente.' },
  { id: 'AN17', t: 'analisis', e: 1, q: 'Una compra de equipo de contado, ¿cómo afecta la ecuación contable?', o: ['Aumenta un activo y disminuye otro activo; el total no cambia', 'Aumenta el activo y el pasivo', 'Disminuye el patrimonio', 'Aumenta el patrimonio'], r: 0, x: 'Entra el equipo y sale el dinero: es un intercambio entre activos.' },

  { id: 'NO01', t: 'nomina', q: 'Un empleado gana $ 1.750.905 (SMMLV 2026). ¿Cuánto se le descuenta por salud y pensión en total?', o: ['$ 140.072', '$ 160.000', '$ 70.036', '$ 150.036'], r: 0, x: '8 % × 1.750.905 = 140.072. El auxilio de transporte no es base de aportes.' },
  { id: 'NO02', t: 'nomina', q: '¿Quién tiene derecho al auxilio de transporte en 2026?', o: ['Quien devenga hasta 2 SMMLV ($ 3.501.810)', 'Todos los empleados', 'Solo quien gana más de 2 SMMLV', 'Solo los contratistas'], r: 0, x: '2 × 1.750.905 = 3.501.810.' },
  { id: 'NO03', t: 'nomina', q: '¿Cuál es el aporte a pensión a cargo del empleador?', o: ['12 %', '4 %', '16 %', '8,5 %'], r: 0, x: 'El total es 16 %: 12 % empleador y 4 % empleado.' },
  { id: 'NO04', t: 'nomina', q: '¿Qué aportes se exoneran según el artículo 114-1 del Estatuto Tributario?', o: ['Salud (8,5 %), ICBF y SENA del empleador, para trabajadores que devengan menos de 10 SMMLV', 'Pensión y caja de compensación', 'ARL y pensión', 'Todos los aportes'], r: 0, x: 'La exoneración aplica a sociedades declarantes de renta y a ciertas personas naturales empleadoras.' },
  { id: 'NO05', t: 'nomina', q: 'La cesantía mensual de un trabajador con base prestacional de $ 2.500.000 es:', o: ['$ 208.250', '$ 250.000', '$ 104.250', '$ 25.000'], r: 0, x: '2.500.000 × 8,33 % = 208.250.' },
  { id: 'NO06', t: 'nomina', q: 'El auxilio de transporte hace parte de la base para:', o: ['Cesantías, intereses sobre cesantías y prima (no para vacaciones ni aportes)', 'Aportes a salud y pensión', 'Solo vacaciones', 'Ningún concepto'], r: 0, x: 'Por eso las vacaciones se calculan solo sobre el salario.' },
  { id: 'NO07', t: 'nomina', q: '¿Cuándo se paga la prima de servicios?', o: ['En dos pagos: a más tardar el 30 de junio y el 20 de diciembre', 'Una vez al año en febrero', 'Cada mes', 'Solo al terminar el contrato'], r: 0, x: 'Cada pago equivale a 15 días de salario por semestre trabajado.' },
  { id: 'NO08', t: 'nomina', q: '¿Hasta qué fecha se consignan las cesantías al fondo?', o: ['Hasta el 14 de febrero del año siguiente', 'Hasta el 31 de enero, directamente al trabajador', 'Hasta el 30 de junio', 'Hasta el 20 de diciembre'], r: 0, x: 'Los intereses sobre cesantías se pagan directamente al trabajador a más tardar el 31 de enero.' },
  { id: 'NO09', t: 'nomina', q: '¿Desde qué salario se aporta al Fondo de Solidaridad Pensional (1 %)?', o: ['4 SMMLV o más', '2 SMMLV o más', '10 SMMLV o más', 'Todos los salarios'], r: 0, x: 'El porcentaje aumenta a partir de 16 SMMLV.' },
  { id: 'NO10', t: 'nomina', q: '¿Cuál es la tarifa de ARL para riesgo I?', o: ['0,522 %', '1,044 %', '2,436 %', '4,35 %'], r: 0, x: 'Riesgo I (oficina) 0,522 %; riesgo II 1,044 %; riesgo III 2,436 %; riesgo IV 4,35 %.' },
  { id: 'NO11', t: 'nomina', mts: 1, q: '¿Qué asiento registra la causación de la nómina?', o: ['Débito 5105 Gastos de personal; crédito 2370 (deducciones) y crédito 2505 Salarios por pagar (neto)', 'Débito 2505; crédito 1110', 'Débito 1110; crédito 5105', 'Débito 5105; crédito 1110 por el devengado'], r: 0, x: 'El pago posterior es débito 2505 / crédito 1110.' },
  { id: 'NO12', t: 'nomina', q: '¿Con qué planilla se pagan los aportes a seguridad social y parafiscales?', o: ['PILA (Planilla Integrada de Liquidación de Aportes)', 'Formulario 350', 'RUT', 'Nómina electrónica'], r: 0, x: 'En la PILA los aportes se aproximan al múltiplo de $ 100 superior.' },

  // 8. Tesorería
  { id: 'TE01', t: 'tesoreria', mts: 1, q: 'El banco rechaza parte de un archivo plano de 100 pagos. ¿Qué haces?', o: ['Revisar el reporte de rechazos (cuenta, tipo de cuenta, NIT, cuenta inactiva), corregir, reprocesar solo los rechazados y conciliar', 'Reenviar el archivo completo con los 100 pagos', 'Pagar los rechazados en efectivo sin soporte', 'Anular todos los pagos'], r: 0, x: 'Reenviar todo generaría pagos dobles a los que sí fueron aceptados.' },
  { id: 'TE02', t: 'tesoreria', mts: 1, q: 'Tienes $ 20.000.000 disponibles y pagos por $ 26.000.000 esta semana. ¿Cómo priorizas según el flujo de caja?', o: ['Primero obligaciones legales y críticas (nómina, impuestos, seguridad social, servicios esenciales) y luego proveedores según vencimiento y negociación', 'Pagar primero a los proveedores más grandes', 'Pagar todo y quedar en sobregiro', 'Pagar en orden alfabético'], r: 0, x: 'El flujo de caja programa los egresos según prioridad y disponibilidad, sin quedar en negativo.' },
  { id: 'TE03', t: 'tesoreria', mts: 1, q: 'Una factura emitida el 10 de julio, con corte al 30 de septiembre, ¿en qué rango de edad de cartera está?', o: ['61–90 días', '31–60 días', '0–30 días', 'Más de 90 días'], r: 0, x: 'Del 10 de julio al 30 de septiembre hay 82 días.' },
  { id: 'TE04', t: 'tesoreria', q: '¿Cómo se registra el reembolso de la caja menor por $ 480.000 en papelería y aseo (sin retenciones)?', o: ['Débito gastos (5195) $ 480.000 / crédito 1110 Bancos $ 480.000', 'Débito 1105 Caja / crédito 5195', 'Débito 1110 / crédito 1105', 'Débito 5195 / crédito 1105 Caja menor'], r: 0, x: 'El fondo de caja menor se mantiene fijo: el reembolso reconoce los gastos y sale dinero del banco.' },
  { id: 'TE05', t: 'tesoreria', mts: 1, q: '¿Qué es un comprobante de egreso generado según el flujo de caja?', o: ['El soporte de un pago programado según la disponibilidad de efectivo y las prioridades aprobadas', 'Una factura de venta', 'Un recibo de caja', 'Una nota crédito'], r: 0, x: 'Cada egreso debe tener aprobación, soporte y estar dentro de la programación de pagos.' },
  { id: 'TE06', t: 'tesoreria', mts: 1, q: '¿Qué es el informe de edades de cartera?', o: ['La clasificación de las cuentas por cobrar según los días vencidos (0–30, 31–60, 61–90, más de 90)', 'El listado de empleados por edad', 'El reporte de activos fijos por antigüedad', 'El flujo de caja proyectado'], r: 0, x: 'Sirve para priorizar el cobro y estimar el deterioro de cartera.' },
  { id: 'TE07', t: 'tesoreria', q: 'Un proveedor ofrece 2 % de descuento si pagas antes de 10 días. ¿Qué evalúas?', o: ['Si hay liquidez y si el descuento supera el costo de oportunidad del dinero', 'Nada, siempre se toma', 'Nunca se toma', 'Solo si el proveedor es grande'], r: 0, x: 'Un 2 % en 20 días de anticipo equivale a una tasa anual muy alta; casi siempre conviene si hay caja.' },
  { id: 'TE08', t: 'tesoreria', mts: 1, q: 'Flujo semanal: saldo inicial $ 8.000.000, recaudos $ 12.000.000 y pagos programados $ 17.500.000. ¿Saldo final proyectado?', o: ['$ 2.500.000', '$ 37.500.000', '−$ 2.500.000', '$ 13.500.000'], r: 0, x: '8.000.000 + 12.000.000 − 17.500.000 = 2.500.000.' },
  { id: 'TE09', t: 'tesoreria', q: '¿Qué control es clave al preparar pagos masivos por portal bancario?', o: ['Doble aprobación (quien prepara no aprueba) y validar cuentas de terceros contra certificaciones bancarias', 'Que una sola persona prepare y apruebe', 'Enviar las claves por correo', 'No guardar los soportes'], r: 0, x: 'La segregación de funciones previene errores y fraudes.' },
  { id: 'TE10', t: 'tesoreria', mts: 1, q: 'El informe de cuentas por pagar debe mostrar como mínimo:', o: ['Proveedor, factura, fecha, vencimiento, valor y saldo pendiente', 'Solo el total', 'Los clientes morosos', 'El listado de empleados'], r: 0, x: 'Con esa información se programa el flujo de caja.' },
  { id: 'TE11', t: 'tesoreria', mts: 1, q: '¿Qué es un arqueo de caja?', o: ['El conteo físico del efectivo para compararlo con el saldo en libros o el reporte del día', 'La consignación diaria', 'El cierre del software', 'La conciliación bancaria'], r: 0, x: 'En un parqueadero se hace al cierre de cada turno del cajero.' },

  // 9. Excel
  { id: 'EX01', t: 'excel', mts: 1, q: '¿Qué hace =BUSCARV(A2;Proveedores!A:D;4;FALSO)?', o: ['Busca A2 en la primera columna de la tabla y devuelve el valor de la 4.ª columna con coincidencia exacta', 'Suma las 4 columnas', 'Busca el valor aproximado más cercano', 'Cuenta cuántas veces aparece A2'], r: 0, x: 'FALSO (o 0) exige coincidencia exacta; VERDADERO busca aproximada y requiere la tabla ordenada.' },
  { id: 'EX02', t: 'excel', mts: 1, q: '¿Por qué BUSCARV devuelve #N/A?', o: ['El valor buscado no existe en la primera columna (o difiere por espacios o por formato texto/número)', 'La fórmula está bien escrita y siempre sale así', 'La tabla tiene demasiadas filas', 'Porque se usó FALSO'], r: 0, x: 'Revisa con RECORTAR/ESPACIOS y convierte texto a número (VALOR) antes de cruzar.' },
  { id: 'EX03', t: 'excel', mts: 1, q: '¿Qué ventaja tiene BUSCARX sobre BUSCARV?', o: ['Puede buscar hacia la izquierda y usa coincidencia exacta por defecto', 'Solo funciona con números', 'Es más lenta', 'No permite indicar qué mostrar si no encuentra el valor'], r: 0, x: 'BUSCARX(valor; matriz_búsqueda; matriz_devuelta; [si_no_se_encuentra]).' },
  { id: 'EX04', t: 'excel', mts: 1, q: 'Quieres sumar las facturas del proveedor “Tecnoparking” con estado “Pendiente”. ¿Qué función usas?', o: ['SUMAR.SI.CONJUNTO', 'CONTAR.SI', 'BUSCARV', 'PROMEDIO'], r: 0, x: '=SUMAR.SI.CONJUNTO(Valor;Proveedor;"Tecnoparking";Estado;"Pendiente").' },
  { id: 'EX05', t: 'excel', mts: 1, q: '¿Qué hace =CONTAR.SI(C:C;"Rechazado")?', o: ['Cuenta las celdas de la columna C que dicen Rechazado', 'Suma los valores rechazados', 'Busca la palabra Rechazado', 'Elimina las filas rechazadas'], r: 0, x: 'Útil para contar pagos rechazados de un archivo plano.' },
  { id: 'EX06', t: 'excel', mts: 1, q: '¿Para qué sirve =SI.ERROR(BUSCARV(...);"No existe")?', o: ['Muestra “No existe” en lugar del error cuando no se encuentra el valor', 'Corrige los datos de la tabla', 'Evita que la fórmula se calcule', 'Convierte texto en número'], r: 0, x: 'Limpia los reportes de cruces sin ocultar la información.' },
  { id: 'EX07', t: 'excel', mts: 1, q: 'En la fórmula =B2*$F$1, ¿qué significa $F$1?', o: ['Referencia absoluta: no cambia al copiar la fórmula', 'Referencia relativa', 'Un valor en dólares', 'Un rango con nombre'], r: 0, x: 'Ideal para fijar una tarifa (por ejemplo, el IVA) en una celda.' },
  { id: 'EX08', t: 'excel', mts: 1, q: '¿Qué herramienta resume miles de movimientos por tercero y por mes en segundos?', o: ['Tabla dinámica', 'Formato condicional', 'Validación de datos', 'Inmovilizar paneles'], r: 0, x: 'Arrastra Tercero a filas, Mes a columnas y Valor a valores.' },
  { id: 'EX09', t: 'excel', mts: 1, q: 'Vas a cruzar el reporte del software del parqueadero con el extracto por número de referencia. ¿Qué haces primero?', o: ['Limpiar y estandarizar la llave (texto/número, espacios con RECORTAR) y luego usar BUSCARV o BUSCARX', 'Copiar y pegar a mano', 'Usar solo filtros', 'Ordenar alfabéticamente y comparar a ojo'], r: 0, x: 'Una llave limpia evita falsos #N/A en el cruce.' },
  { id: 'EX10', t: 'excel', mts: 1, q: '¿Qué fórmula calcula los días vencidos de una factura con fecha en A2 y fecha de corte en $H$1?', o: ['=$H$1-A2', '=A2-$H$1', '=SUMA(A2;H1)', '=HOY()'], r: 0, x: 'Fecha de corte menos fecha de la factura.' },
  { id: 'EX11', t: 'excel', mts: 1, q: 'Para clasificar la edad de cartera según los días en B2, ¿qué función es más adecuada?', o: ['SI anidado o SI.CONJUNTO (0–30, 31–60, 61–90, más de 90)', 'CONCATENAR', 'MAYUSC', 'REDONDEAR'], r: 0, x: '=SI.CONJUNTO(B2<=30;"0-30";B2<=60;"31-60";B2<=90;"61-90";VERDADERO;">90").' },
  { id: 'EX12', t: 'excel', mts: 1, q: '¿Qué hace =REDONDEAR(A2*19%;0)?', o: ['Calcula el 19 % de A2 y lo redondea a pesos enteros', 'Suma 19 a A2', 'Calcula el 19 % sin redondear', 'Redondea A2 a la decena'], r: 0, x: 'Con 0 decimales redondea al peso.' },

const Calc = {
  iva: (base, tarifa) => redondear(base * (tarifa === undefined ? P.iva : tarifa)),
  uvt: (n) => redondear(n * P.uvt),
  minimoRF(tipo) {
    if (tipo === 'compra') return Calc.uvt(P.baseComprasUVT);
    if (tipo === 'arrendamiento') return Calc.uvt(P.baseArrendamientoUVT);
    if (tipo === 'honorariosPJ' || tipo === 'honorariosPN') return 0;
    return Calc.uvt(P.baseServiciosUVT);
  },
  tarifaRF(tipo, declarante) {
    switch (tipo) {
      case 'compra': return declarante ? P.rfComprasDecl : P.rfComprasNoDecl;
      case 'servicio': return declarante ? P.rfServiciosDecl : P.rfServiciosNoDecl;
      case 'honorariosPJ': return P.rfHonorariosPJ;
      case 'honorariosPN': return P.rfHonorariosPN;
      case 'arrendamiento': return P.rfArrendamiento;
      default: return 0;
    }
  },
  retefuente(base, tipo, declarante) {
    const minimo = Calc.minimoRF(tipo), tarifa = Calc.tarifaRF(tipo, declarante);
    const aplica = base >= minimo && tarifa > 0;
    return { aplica, minimo, tarifa, valor: aplica ? redondear(base * tarifa) : 0 };
  },
  minimoIvaIca(tipo) { if (!P.basesMinimasReteIvaIca) return 0; return tipo === 'compra' ? Calc.uvt(P.baseComprasUVT) : Calc.uvt(P.baseServiciosUVT); },
  reteiva(iva, base, tipo, granContribuyente) {
    const minimo = Calc.minimoIvaIca(tipo);
    const aplica = !!granContribuyente && iva > 0 && base >= minimo;
    return { aplica, minimo, valor: aplica ? redondear(iva * P.reteIVA) : 0 };
  },
  reteica(base, tarifaMil, tipo) {
    const minimo = Calc.minimoIvaIca(tipo);
    const aplica = tarifaMil > 0 && base >= minimo;
    return { aplica, minimo, tarifaMil, valor: aplica ? redondear(base * tarifaMil / 1000) : 0 };
  },
  gmf: (v) => redondear(v * P.gmf),
  depMensual: (costo, residual, meses) => redondear((costo - residual) / meses),
  nomina(salario, opciones) {
    const o = Object.assign({ exonerada: true, dias: 30 }, opciones || {});
    const sal = redondear(salario * o.dias / 30);
    const tieneAux = salario <= P.topeAuxSMMLV * P.smmlv;
    const aux = tieneAux ? redondear(P.auxTransporte * o.dias / 30) : 0;
    const salud = redondear(sal * P.saludEmpleado), pension = redondear(sal * P.pensionEmpleado);
    const fsp = salario >= P.fspUmbralSMMLV * P.smmlv ? redondear(sal * P.fsp) : 0;
    const devengado = sal + aux, deducciones = salud + pension + fsp, neto = devengado - deducciones;
    const basePrest = sal + aux;
    const cesantias = redondear(basePrest * P.cesantias);
    const intereses = redondear(basePrest * P.interesesCesantias);
    const interesesAlt = redondear(cesantias * 0.12);
    const prima = redondear(basePrest * P.prima);
    const vacaciones = redondear(sal * P.vacaciones);
    const ap = {
      pension: redondear(sal * P.pensionEmpleador), arl: redondear(sal * P.arl), caja: redondear(sal * P.caja),
      salud: o.exonerada ? 0 : redondear(sal * P.saludEmpleador), icbf: o.exonerada ? 0 : redondear(sal * P.icbf), sena: o.exonerada ? 0 : redondear(sal * P.sena)
    };
    const aportes = ap.pension + ap.arl + ap.caja + ap.salud + ap.icbf + ap.sena;
    const aportes100 = ceil100(sal * P.pensionEmpleador) + ceil100(sal * P.arl) + ceil100(sal * P.caja) +
      (o.exonerada ? 0 : ceil100(sal * P.saludEmpleador) + ceil100(sal * P.icbf) + ceil100(sal * P.sena));
    return { salario: sal, aux, tieneAux, salud, pension, fsp, devengado, deducciones, neto, basePrest, cesantias, intereses, interesesAlt, prima, vacaciones,
      prestaciones: cesantias + intereses + prima + vacaciones, prestacionesAlt: cesantias + interesesAlt + prima + vacaciones, ap, aportes, aportes100 };
  }
};

  facturacionFija: { etapa: 3, tema: 'facturacion', mts: true, titulo: 'Facturación fija de mensualidades y recaudo con retención',

  pagoProveedor: { etapa: 3, tema: 'tesoreria', mts: true, titulo: 'Comprobante de egreso según el flujo de caja',
    crear(r, nivel) {
      const fecha = hoyEj(r, 10, 28);
      const provs = r.varios(NOMBRES.proveedoresServicios.concat(NOMBRES.proveedoresBienes), 3);
      const facturas = provs.map((p, k) => ({ prov: p, cuenta: NOMBRES.proveedoresBienes.includes(p) ? '2205' : '2335', valor: r.monto(600000, 6000000, 100), vence: r.ent(1, 28), num: 'FE-' + r.ent(1000, 9999) }));
      let pagar;
      let texto = '';
      if (nivel === 1) { pagar = [facturas[0]]; texto = `<p>El ${fecha} pagas por transferencia la factura ${facturas[0].num} de <b>${facturas[0].prov}</b> por <b>${pesos(facturas[0].valor)}</b> (ya causada).</p>`; }
      else if (nivel === 2) { pagar = facturas.slice(0, 2); texto = `<p>El ${fecha}, según la programación del flujo de caja, pagas por transferencia estas facturas ya causadas:</p><ul>${pagar.map((f) => `<li>${f.prov} – ${f.num}: ${pesos(f.valor)}</li>`).join('')}</ul>`; }
      else {
        const orden = facturas.slice().sort((a, b) => a.vence - b.vence);
        pagar = orden.slice(0, 2);
        const disponible = suma(pagar, (f) => f.valor) + Calc.gmf(suma(pagar, (f) => f.valor)) + r.monto(50000, Math.min(orden[2].valor - 60000, 900000), 1000);
        texto = `<p>El ${fecha} tienes un disponible de <b>${pesos(disponible)}</b> para pagar proveedores. La política es pagar primero lo que vence antes, sin quedar en negativo. Facturas pendientes (ya causadas):</p>` +
          `<div class="desplazar"><table class="tabla"><thead><tr><th>Proveedor</th><th>Factura</th><th>Vence</th><th class="num">Valor</th></tr></thead><tbody>${facturas.map((f) => `<tr><td>${f.prov}</td><td>${f.num}</td><td>día ${f.vence}</td><td class="num">${pesos(f.valor)}</td></tr>`).join('')}</tbody></table></div>`;

        { id: 'total', etiqueta: 'Total pagado a proveedores', valor: total },
        conGmf && { id: 'gmf', etiqueta: 'GMF (4 × 1.000)', valor: gmf, pista: 'Total pagado × 4 ÷ 1.000.' },
        { id: 'salida', etiqueta: 'Total que sale del banco', valor: total + gmf }

      return {
        enunciado: texto + (conGmf ? '<p>La cuenta bancaria no está exenta de GMF: registra el 4 × 1.000 en el mismo comprobante.</p>' : '') + '<p>Registra el comprobante de egreso.</p>',
        campos,
        asientos: [asiento('Comprobante de egreso', fecha, [
          ...pagar.map((f) => D(f.cuenta, f.valor, { eq: ['2205', '2335'], det: f.prov, pista: 'Al pagar disminuye la cuenta por pagar: débito.' })),
          D('5305', gmf, { eq: EQ_GMF, pista: 'El GMF es un gasto: débito 5305 (o 5115 Impuestos).' }),
          H('1110', total + gmf, { pista: 'Sale dinero del banco: crédito 1110.' })
        ])],
        sugeridas: ['2205', '2335', '5305', '5115', '1110', '1105'],
        solucion: pasos([nivel >= 3 && `Por vencimiento se pagan primero ${pagar.map((f) => f.prov).join(' y ')}; la tercera no cabe en el disponible.`,
          `Total pagado = <b>${miles(total)}</b>.`, conGmf && `GMF = ${miles(total)} × 4 ÷ 1.000 = <b>${miles(gmf)}</b>.`, `Salida de bancos = <b>${miles(total + gmf)}</b>.`,
          'El gasto ya se reconoció al causar las facturas: el egreso solo cancela la cuenta por pagar.'])
      };
    } },

  conciliacionBancaria: { etapa: 7, tema: 'conciliacion', mts: true, titulo: 'Conciliación bancaria',
    crear(r, nivel) {
      const { anio, mes } = CONFIG.mesEjercicios, fin = fechaTxt(diasDelMes(mes, anio), mes, anio);
      const banco = r.elegir(NOMBRES.bancos);
      const provs = r.barajar(NOMBRES.proveedoresServicios);
      const cheques = Array.from({ length: nivel === 1 ? r.ent(1, 2) : nivel === 2 ? 2 : r.ent(2, 3) }, (_, k) => ({ num: String(r.ent(4100, 4999)), benef: provs[k], valor: r.monto(300000, 4500000, 100) }));
      const transito = r.monto(800000, 5000000, 100);
      const comision = r.monto(8000, 60000, 100), ivaCom = nivel >= 3 ? Calc.iva(comision) : 0;
      const gmf = nivel >= 2 ? r.monto(15000, 160000, 100) : 0;
      const intereses = nivel >= 2 ? r.monto(3000, 90000, 100) : 0;
      const cliente = r.elegir(NOMBRES.clientes);
      const transfer = nivel >= 3 ? r.monto(500000, 4500000, 1000) : 0;
      const error = nivel >= 3 && r.si(0.6) ? (() => {
        const a = r.ent(3, 9), b = r.ent(0, a - 1), m = r.ent(1, 3);
        const ok = m * 1e6 + a * 1e5 + b * 1e4, mal = m * 1e6 + b * 1e5 + a * 1e4;
        return { num: String(r.ent(4000, 4099)), ok, mal, dif: ok - mal };
      })() : null;
      const extracto = r.monto(9000000, 55000000, 100);
      const ajustado = extracto - suma(cheques, (c) => c.valor) + transito;
      const nd = comision + ivaCom + gmf, nc = intereses + transfer, difErr = error ? error.dif : 0;
      const libros = ajustado + nd - nc + difErr;
      const items = [
        ...cheques.map((c) => `Cheque No. ${c.num} girado a ${c.benef} por <b>${pesos(c.valor)}</b>: está en libros y el banco aún no lo ha pagado.`),
        `Consignación de recaudos del ${fin} por <b>${pesos(transito)}</b>: registrada en libros; el banco la abonó el día 1 del mes siguiente.`,
        `Comisión por manejo de cuenta de <b>${pesos(comision)}</b>${ivaCom ? ` más IVA de <b>${pesos(ivaCom)}</b>` : ''}: cargada en el extracto y no registrada.`,
        gmf && `GMF (4 × 1.000) cobrado en el mes por <b>${pesos(gmf)}</b>: no registrado en libros.`,
        intereses && `Intereses abonados por el banco por <b>${pesos(intereses)}</b>: no registrados.`,
        transfer && `Transferencia de ${cliente} por <b>${pesos(transfer)}</b> para abonar a su factura: no está registrada en libros.`,
        error && `El cheque No. ${error.num} a un proveedor se registró en libros por <b>${pesos(error.mal)}</b>, pero el banco lo pagó por <b>${pesos(error.ok)}</b>, que es el valor correcto de la factura.`
      ].filter(Boolean);
      const asientos = [asiento('Nota débito: partidas del banco no registradas', fin, [
        D('5305', comision + gmf, { eq: EQ_GMF, det: 'Comisión y GMF', pista: 'Comisión y GMF son gastos: débito 5305 (el GMF también puede ir a 5115).' }),
        D('2408', ivaCom, { pista: 'El IVA de la comisión es descontable: débito 2408.' }),
        D('2205', difErr, { eq: ['2335'], pista: 'La diferencia del cheque corresponde a la deuda con el proveedor: débito 2205.' }),
        H('1110', nd + difErr, { pista: 'Disminuye bancos en libros: crédito 1110.' })
      ])];
      if (nc) asientos.push(asiento('Nota crédito: abonos del banco no registrados', fin, [
        D('1110', nc, { pista: 'Aumenta bancos en libros: débito 1110.' }),
        H('4210', intereses, { eq: ['42'], pista: 'Intereses ganados: ingreso financiero, crédito 4210.' }),
        H('1305', transfer, { pista: 'El abono del cliente disminuye su cartera: crédito 1305.' })
      ]));
      return {
        enunciado: `<p>Concilia la cuenta corriente de ${banco} al ${fin}.</p>` + datos([['Saldo según extracto', pesos(extracto)], ['Saldo según libros (1110)', pesos(libros)]]) +
          '<p>Al cruzar el extracto con el auxiliar de bancos encuentras:</p><ul>' + items.map((t) => `<li>${t}</li>`).join('') + '</ul>',
        campos: [
          { id: 'ajExt', etiqueta: 'Saldo ajustado según extracto', valor: ajustado, pista: 'Extracto − cheques pendientes + consignaciones en tránsito.' },
          { id: 'nd', etiqueta: 'Total a restar en libros', valor: nd + difErr, pista: 'Lo que el banco descontó y la empresa no ha registrado (y errores que disminuyen bancos).' },
          { id: 'nc', etiqueta: 'Total a sumar en libros', valor: nc, pista: 'Lo que el banco abonó y la empresa no ha registrado (0 si no hay).' },
          { id: 'ajLib', etiqueta: 'Saldo ajustado según libros', valor: ajustado, pista: 'Libros − notas débito + notas crédito. Debe ser igual al del extracto.' }
        ],
        asientos,
        sugeridas: ['5305', '5115', '2408', '1110', '4210', '1305', '2205'],
        solucion: pasos([`Extracto ajustado = ${miles(extracto)} − ${miles(suma(cheques, (c) => c.valor))} (cheques pendientes) + ${miles(transito)} (consignación en tránsito) = <b>${miles(ajustado)}</b>.`,
          `Libros ajustados = ${miles(libros)} − ${miles(nd + difErr)} + ${miles(nc)} = <b>${miles(ajustado)}</b>. ✔ Coinciden.`,
          'Solo lo que el banco registró y la empresa no (y los errores de libros) lleva asiento. Cheques pendientes y consignaciones en tránsito se cruzan solos el mes siguiente.',
          error && `Error de transposición: ${miles(error.ok)} − ${miles(error.mal)} = ${miles(error.dif)}${error.dif % 9 === 0 ? ', divisible por 9' : ''}.`])
      };
    } },

  conciliacionRecaudos: { etapa: 7, tema: 'conciliacion', mts: true, titulo: 'Conciliación de recaudos del parqueadero',
    crear(r, nivel) {
      const { anio, mes } = CONFIG.mesEjercicios, dia = r.ent(5, 26), fecha = fechaTxt(dia, mes, anio);
      const ef = r.monto(1800000, 7000000, 500), dat = r.monto(900000, 4000000, 500), qr = nivel >= 2 ? r.monto(200000, 1200000, 500) : 0;
      const esc = nivel === 1 ? r.elegir(['faltante', 'sobrante']) : r.elegir(['faltante', 'sobrante', 'transito']);
      const dif = esc === 'transito' ? r.monto(300000, 900000, 500) : r.monto(10000, 150000, 500);
      const consignado = esc === 'sobrante' ? ef + dif : ef - dif;
      const tasa = r.elegir([0.015, 0.018, 0.02, 0.025, 0.03]);
      const com = redondear(dat * tasa), ivaCom = nivel >= 2 ? Calc.iva(com) : 0;
      const baseTarj = redondear(dat / (1 + P.iva));

      const descuentos = com + ivaCom + rfT + rivaT, abono = dat - descuentos;

  errorBalance: { etapa: 5, tema: 'analisis', mts: true, titulo: 'Balance de prueba descuadrado',
    crear(r, nivel) {
      const base = [['1105', 'D'], ['1110', 'D'], ['1305', 'D'], ['1528', 'D'], ['1592', 'C'], ['2205', 'C'], ['2365', 'C'], ['2408', 'C'], ['3105', 'C'], ['4155', 'C'], ['5105', 'D'], ['5135', 'D']];
      const vals = base.map(([c, l]) => ({ c, l, v: r.monto(500000, 30000000, 1000) }));
      const tipo = r.elegir(['transposicion', 'unilateral', 'lado']);
      const vic = r.elegir(vals.filter((x) => ['5135', '1305', '2205', '5105'].includes(x.c)));
      let mal = 0;
      if (tipo === 'transposicion') {
        const a = r.ent(1, 9); let b = r.ent(0, 9); if (b === a) b = (a + 3) % 10;
        const m = r.ent(1, 20), resto = r.ent(0, 9) * 1000;
        vic.v = m * 1e6 + a * 1e5 + b * 1e4 + resto; mal = m * 1e6 + b * 1e5 + a * 1e4 + resto;
      }
      const dif0 = suma(vals.filter((x) => x.l === 'D'), (x) => x.v) - suma(vals.filter((x) => x.l === 'C'), (x) => x.v);
      const cap = vals.find((x) => x.c === '3105'); cap.v += dif0;
      if (cap.v <= 0) { const caj = vals.find((x) => x.c === '1110'); caj.v += -cap.v + 5000000; cap.v = 5000000; }
      let detalle, efD = 0, efC = 0;
      if (tipo === 'transposicion') {
        const d = mal - vic.v;
        if (vic.l === 'D') efD = d; else efC = d;
        detalle = { d: Math.abs(d), ok: 0, txt: `En la cuenta ${vic.c} se pasó ${pesos(mal)} en lugar de ${pesos(vic.v)}: se transpusieron cifras.` };
      } else if (tipo === 'unilateral') {
        const v = r.monto(200000, 3000000, 1000); efD = v;
        detalle = { d: v, ok: 1, txt: `Un débito de ${pesos(v)} se registró sin su crédito.` };
      } else {

      }
      const totD = suma(vals.filter((x) => x.l === 'D'), (x) => x.v) + efD, totC = suma(vals.filter((x) => x.l === 'C'), (x) => x.v) + efC;
      const ops = ['Transposición de cifras (la diferencia es divisible por 9)', 'Un valor registrado en un solo lado (la diferencia es igual al valor)', 'Un valor pasado al lado contrario (la diferencia es el doble del valor)', 'Un asiento completo omitido'];
      return {

        campos: [
          { id: 'dif', etiqueta: 'Diferencia (valor absoluto)', valor: Math.abs(totD - totC) },
          { id: 'causa', tipo: 'opcion', etiqueta: '¿Qué error es más probable?', ops, ok: detalle.ok, pista: 'Divide la diferencia entre 9 y entre 2, y compárala con las partidas.' }
        ],
        asientos: [],
        solucion: pasos([`Diferencia = |${miles(totD)} − ${miles(totC)}| = <b>${miles(Math.abs(totD - totC))}</b>.`, detalle.txt, tipo === 'transposicion' ? `${miles(detalle.d)} ÷ 9 = ${miles(detalle.d / 9)}: es divisible por 9.` : '',
          'Recuerda: omitir un asiento completo o usar una cuenta equivocada del mismo lado NO descuadra el balance de prueba.'])

/* ---------- Calificación ---------- */
function codigoDe(txt) { const m = String(txt || '').match(/\d+/); return m ? m[0] : ''; }
function numOr0(x) { const v = leerNumero(x); return Number.isFinite(v) ? v : 0; }
function coincideCuenta(miembro, cod) { return miembro.length <= 2 ? cod.startsWith(miembro) : cod.slice(0, 4) === miembro.slice(0, 4); }

/* Compara un asiento del usuario con la solución.
   Agrupa por cuenta (4 dígitos) y lado; acepta cuentas equivalentes (eq), valores alternativos (alt)
   y líneas partidas (dos líneas de 1305 suman). Tolerancia ± CONFIG.toleranciaPesos por línea. */
function calificarAsiento(esperadas, usuario) {
  const tol0 = CONFIG.toleranciaPesos;
  const porCuenta = {};
  for (const l of esperadas) { const c4 = l.c.slice(0, 4); porCuenta[c4] = porCuenta[c4] || { d: 0, h: 0 }; porCuenta[c4].d += l.d || 0; porCuenta[c4].h += l.h || 0; }
  const neto = new Set(Object.keys(porCuenta).filter((k) => porCuenta[k].d > 0 && porCuenta[k].h > 0));
  const grupos = [], idx = {};
  for (const l of esperadas) {
    const c4 = l.c.slice(0, 4), lado = neto.has(c4) ? 'N' : ((l.d || 0) > 0 ? 'D' : 'H');
    const valor = lado === 'N' ? (l.d || 0) - (l.h || 0) : (l.d || l.h);
    const k = c4 + '|' + lado;
    let g = idx[k];
    if (!g) { g = idx[k] = { k, c: c4, lado, total: 0, deltas: [0], miembros: new Set([c4]), n: 0, usuario: [], nombre: nombreCuenta(c4), pista: l.pista || '' }; grupos.push(g); }
    for (const e of (l.eq || [])) g.miembros.add(e.length <= 2 ? e : e.slice(0, 4));
    const signo = lado === 'N' && (l.h || 0) > 0 ? -1 : 1;
    const ds = (l.alt || []).map((a) => signo * (a - (l.d || l.h)));
    const nuevos = new Set();
    for (const b of g.deltas) { nuevos.add(b); for (const x of ds) nuevos.add(b + x); }
    g.deltas = [...nuevos].slice(0, 32);
    g.total += valor; g.n++;
    if (!g.pista && l.pista) g.pista = l.pista;
  }
  const lineas = usuario.map(() => ({ estado: 'vacia', msg: '' }));
  let totD = 0, totH = 0;
  const extras = new Set();
  usuario.forEach((u, i) => {
    const cod = codigoDe(u.cod), d = numOr0(u.d), h = numOr0(u.h);
    totD += d; totH += h;
    if (!cod && !d && !h) return;
    const marcar = (estado, msg, clave) => { lineas[i] = { estado, msg }; extras.add(clave || ('?' + i)); };
    if (cod.length < 4) return marcar('mal', cod ? 'Escribe el código con al menos 4 dígitos.' : 'Falta el código de la cuenta.');
    if (d > 0 && h > 0) return marcar('mal', 'Una línea no puede llevar débito y crédito a la vez.');
    if (!(d > 0) && !(h > 0)) return marcar('mal', 'Falta el valor (débito o crédito).');
    const lado = d > 0 ? 'D' : 'H', monto = d || h;
    const coincide = (g) => [...g.miembros].some((m) => coincideCuenta(m, cod));
    let g = grupos.find((x) => x.lado === 'N' && coincide(x));
    if (g) { g.usuario.push({ i, monto: lado === 'D' ? monto : -monto }); return; }
    g = grupos.find((x) => x.lado === lado && coincideCuenta(x.c, cod)) || grupos.find((x) => x.lado === lado && coincide(x));
    if (g) { g.usuario.push({ i, monto }); return; }
    const otro = grupos.find((x) => x.lado !== lado && coincide(x));
    if (otro) return marcar('lado', `La cuenta es correcta, pero va al ${otro.lado === 'D' ? 'débito' : 'crédito'}.`, cod.slice(0, 4) + '|' + lado);
    return marcar('mal', 'Esta cuenta no corresponde a esta transacción.', cod.slice(0, 4) + '|' + lado);
  });
  let aciertos = 0;
  const faltantes = [];
  for (const g of grupos) {
    if (!g.usuario.length) { faltantes.push({ c: g.c, lado: g.lado, nombre: g.nombre, pista: g.pista }); continue; }
    const s = suma(g.usuario, (x) => x.monto), tol = tol0 * Math.max(1, g.n, g.usuario.length);
    const ok = g.deltas.some((dl) => Math.abs(s - (g.total + dl)) <= tol);

    for (const x of g.usuario) lineas[x.i] = ok ? { estado: 'ok', msg: '' } : { estado: 'mal', msg: 'Cuenta y lado correctos, pero el valor no coincide.' };
  }
  const total = grupos.length + extras.size;
  return { puntaje: total ? aciertos / total : 1, aciertos, total, lineas, faltantes, cuadra: Math.abs(totD - totH) <= 1, totD, totH };
}
function calificarCampo(campo, resp) {
  if (campo.tipo === 'opcion') { const vacio = resp === undefined || resp === null || resp === ''; return { ok: !vacio && Number(resp) === campo.ok, vacio }; }
  const v = leerNumero(resp);
  if (!Number.isFinite(v)) return { ok: false, vacio: resp === undefined || resp === null || String(resp).trim() === '' };
  const tol = campo.tol === undefined ? CONFIG.toleranciaPesos : campo.tol;
